    parameters:
    - schema:
        type: string
      name: locationId
      in: path
      required: true
      description: Location identifier
    get:
      summary: Get location energy usage breakdown
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultWrapper'
              examples:
                Breakdown:
                  value:
                    result:
                      accuracy: MEDIUM
                      total_value: 100450
                      from: '2019-10-01T00:00:00'
                      to: '2019-11-01T00:00:00'
                      unit: energy
                      breakdown:
                      - category: cooking
                        value: 25047
                      - category: fridge_freezer
                        value: 35623
                      - category: washing
                        value: 18188
                      - category: heating
                        value: 4223
                      - category: always_on
                        value: 6365
                      - category: lightning
                        value: 11000
                    result_status:
                      code: ok
                      action: null
        '400':
          description: 'Bad Request


            Possible errors


            | *type* | *category* | *description* |

            | --- | --- | --- |

            | client_error | invalid_parameter | Timespan too large, one month is maximum allowed |

            | client_error | invalid_parameter | Request input data is invalid |

            | client_error | invalid_parameter | CUSTOM_PERIOD_MUST_BE_AT_LEAST_28_DAYS |'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Error example:
                  value:
                    type: client_error
                    category: invalid_parameter
                    description: Timespan too large, one month is maximum allowed
                    message: 'Something went wrong, please try again later. If problem remains, please contact support (error:
                      1ad3a534117d4).'
                    transaction_id: 37c4ef86-d525-42c8-b65f-9b4cfcce0df6
        '501':
          description: 'Not Implemented


            Possible errors


            | *type* | *category* | *description* |

            | --- | --- | --- |

            | internal_error | breakdown_error | Breakdown for current month is not supported |

            | internal_error | breakdown_error | House type required for breakdown |

            | internal_error | breakdown_error | Not enough data points |

            | internal_error | breakdown_error | Solar panels are not supported in breakdown |

            | internal_error | breakdown_error | House type required for breakdown |

            | internal_error | breakdown_error | DAILY_RESOLUTION_OR_BETTER_REQUIRED_FOR_CUSTOM_PERIOD |'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Error example:
                  value:
                    type: internal_error
                    category: breakdown_error
                    description: Not enough data points
                    message: 'Something went wrong, please try again later. If problem remains, please contact support (error:
                      1ad3a534117d4).'
                    transaction_id: 37c4ef86-d525-42c8-b65f-9b4cfcce0df6
      operationId: get-v3-locations-locationId-breakdown
      description: "### This Endpoint is deprecated DEPRECATED\n\n“The new EUC endpoint \"Get location energy usage categories\
        \ (EUC)\" should be used to get Energy Usage Categories instead. Eliq will continue to support this endpoint and will\
        \ communicate a date when this endpoint will no longer be supported once a date has been set.”\n\nGet energy usage\
        \ breakdown for a location.\n\nEnergy usage is analyzed and broken down into a list of different usage categories.\
        \ Energy Usage Categories helps homeowners to better understand their energy usage and learn what appliances consume\
        \ the most energy.\n\nThe endpoint returns 400 errors when there is an obvious implementation mistake and 501 errors\
        \ when the error is caused by missing data. So please note that 501 errors are expected from this endpoint and this\
        \ needs to be handled on the client side. All possible errors are listed below.\n\n`NOTE!` For cost to be available\
        \ as a unit type, the location prices must be set in our database. If no location prices are available there will\
        \ be an error response.\n\n`NOTE!` As default the from and to date are always rounded down to the nearest start of\
        \ the month and returns full months. Max one month can be return in each call. However for locations that have daily\
        \ data it is also possible to request EUC between two dates. We support a range between 28 - 31 days. Please set the\
        \ custom_period to true to make this call.\n\n### Data requirements \n**Required data**\n\n* Monthly data: Minimum\
        \ 1 month\n* Geo location: Address information\n* Home profile: Minimum house type\n\n**Optional (improved accuracy)**\n\
        \n* Hourly data: Minimum 30 days of hourly´or sub-hourly data\n\n### Possible breakdown categories electricity\n\n\
        | *Field* | *Description* |\n| --- | --- |\n| heating | Electricity usage used for space heating |\n| washing | Electricity\
        \ usage used for laundry |\n| water_heating | Electricity usage used for water heating |\n| lightning | Electricity\
        \ usage used for lighting. OBS! Please note that the key is misnamed to ligthning and not lighting :) |\n| consumer_electronics\
        \ | Electricity usage used for home electronics |\n| cooking | Electricity usage used for cooking |\n| always_on |\
        \ Electricity usage used for always on appliances |\n| fridge_freezer | Electricity usage used by fridge and freezers\
        \ |\n| cooling | Electricity usage used to cool the home |\n| electric_vehicle | Electricity usage used for charging\
        \ of cars |\n| other | Electricity usage used by appliances not matching other categories |\n| standing_charge | If\
        \ unit is set to \"cost\", the cost for the standing charge is presented in a separate category |\n\n### Possible\
        \ breakdown categories gas\n\n| *Field* | *Description* |\n| --- | --- |\n| heating | Gas usage used for heating |\n\
        | water_heating | Gas usage used for heating water |\n| cooking | Gas usage usage used for cooking |\n| standing_charge\
        \ | If unit is set to \"cost\", the cost for the standing charge is presented in a separate category |\n"
      parameters:
      - schema:
          type: string
          example: energy
          enum:
          - energy
          - cost
          default: energy
        in: query
        name: unit
        description: Unit to receive result in.
        allowEmptyValue: true
      - schema:
          type: string
          default: elec
          enum:
          - elec
          - gas
          example: elec
        in: query
        name: fuel
        description: Fuel to get breakdown for. Currently 'elec' and 'gas' is supported.
      - schema:
          type: string
          example: '2021-01-01T00:00:00'
        in: query
        name: from
        description: 'From which date to retrieve breakdown '
      - schema:
          type: string
          example: '2021-02-01'
        in: query
        name: to
        description: To which date to retrieve breakdown for (exclusive)
      - schema:
          type: string
          default: 'false'
          enum:
          - 'false'
          - 'true'
          example: 'false'
        in: query
        name: custom_period
        description: Set to true to be able to get a custom range between two dates.
      tags:
      - Breakdown
      deprecated: true
  /v3/locations/{locationId}/euc:
    get:
      tags:
      - Energy Usage Categories
      summary: Get energy usage categories (EUC) for a location
      description: "Get location energy usage by category.\r\n\r\nRequested EUC period must be in a range of 28 - 366 days\
        \ (minimum 1 month, maximum 1 year).\r\n\r\nFor cost to be available as a unit type, the location must have device\
        \ price formulas set in our system.\r\n\r\nUnit of m3 is only available with fuel of gas. Conversion between m3 and\
        \ Wh values relies on a calorific rate being configured for a client. Please contact Eliq for more details about having\
        \ this configuration in place.\r\n\r\n### Data requirements\r\nEUC requires some prerequisites in order to work.\r\
        \n#### Electricity\r\n* Monthly energy data: Minimum 30 days of data\r\n  - (Optional) Hourly energy data: Minimum\
        \ 30 days of hourly or sub-hourly data\r\n* Geo location: Address information\r\n* Location profile: At least house\
        \ type for residential profile or business type for business profile.\r\n\r\n#### Gas\r\n* Monthly energy data: Minimum\
        \ one month of data\r\n* Geo location: Address information\r\n* Location profile: At least house type for residential\
        \ profile or business type for business profile.\r\n\r\n### Electricity categories\r\n| *Field* | *Description* |\r\
        \n| --- | --- |\r\n| heating | Electricity usage used for space heating |\r\n| washing | Electricity usage used for\
        \ laundry |\r\n| water_heating | Electricity usage used for water heating |\r\n| lighting | Electricity usage used\
        \ for lighting. |\r\n| consumer_electronics | Electricity usage used for home electronics |\r\n| cooking | Electricity\
        \ usage used for cooking |\r\n| always_on | Electricity usage used for always on appliances |\r\n| fridge_freezer\
        \ | Electricity usage used by fridge and freezers |\r\n| cooling | Electricity usage used to cool the home |\r\n|\
        \ electric_vehicle | Electricity usage used for charging of cars |\r\n| sauna | Electricity usage used for heating\
        \ your sauna |\r\n| other | Electricity usage used by appliances not matching other categories |\r\n\r\n### Gas categories\r\
        \n| *Field* | *Description* |\r\n| --- | --- |\r\n| heating | Gas usage used for heating |\r\n| water_heating | Gas\
        \ usage used for heating water |\r\n| cooking | Gas usage usage used for cooking |"
      operationId: get-v3-locations-locationId-euc
      parameters:
      - name: locationId
        in: path
        description: Location id
        required: true
        schema:
          type: integer
          format: int32
      - name: from
        in: query
        description: From date
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: To date, exclusive
        required: true
        schema:
          type: string
          format: date-time
      - name: unit
        in: query
        description: 'Unit. Valid values: ''cost'', ''energy'', ''m3''.'
        schema:
          type: string
          default: energy
      - name: fuel
        in: query
        description: 'Fuel. Valid values: ''elec'', ''gas'', ''district_heating''.'
        schema:
          type: string
          default: elec
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EUC'
              examples:
                EUC data monthly:
                  value:
                    accuracy: medium
                    total_value: 12881
                    from: '2024-02-01T00:00:00'
                    to: '2024-03-01T00:00:00'
                    unit: energy
                    breakdown:
                    - category: lighting
                      value: 1350
                      percentage: 10.48
                    - category: fridge_freezer
                      value: 2203
                      percentage: 17.1
                    - category: washing
                      value: 672
                      percentage: 5.22
                    - category: heating
                      value: 8656
                      percentage: 67.2
                EUC data yearly:
                  value:
                    accuracy: medium
                    total_value: 250340
                    from: '2024-01-01T00:00:00'
                    to: '2025-01-01T00:00:00'
                    unit: energy
                    breakdown:
                    - category: lighting
                      value: 135021
                      percentage: 10.48
                    - category: fridge_freezer
                      value: 22031
                      percentage: 17.1
                    - category: washing
                      value: 6722
                      percentage: 5.22
                    - category: heating
                      value: 86566
                      percentage: 67.2
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Not supported or missing profile type:
                  value:
                    code: NOT_SUPPORTED_PROFILE_TYPE
                    transaction_id: 0HN1O72JU5P3C:00000001
                    description: Locations profile type is not supported or missing for EUC.
                Not enough home profile options:
                  value:
                    code: NOT_ENOUGH_HOME_PROFILE_OPTIONS_SET
                    transaction_id: 0HN1O72JU5P3C:00000001
                    description: Not enough home profile options set.
                Not enough business profile options:
                  value:
                    code: NOT_ENOUGH_BUSINESS_PROFILE_OPTIONS_SET
                    transaction_id: 0HN1O72JU5P3C:00000001
                    description: All required business profile options must be set.
                House type required:
                  value:
                    code: HOUSE_TYPE_REQUIRED_FOR_EUC
                    transaction_id: 0HN1O72JU5P3C:00000001
                    description: House type required for EUC.
                Business type required:
                  value:
                    code: BUSINESS_TYPE_REQUIRED_FOR_EUC
                    transaction_id: 0HN1O72JU5P3C:00000001
                    description: Business type required for EUC.
                Euc not supported for business type:
                  value:
                    code: EUC_NOT_SUPPORTED_FOR_BUSINESS_TYPE
                    transaction_id: 0HN1O72JU5P3C:00000001
                    description: EUC is not supported for the selected business type.
                Not enough data points:
                  value:
                    code: NOT_ENOUGH_DATA_POINTS
                    transaction_id: 0HN1O72JU5P3C:00000001
                    description: Not enough data point for the requested period.
                No consumption for solar:
                  value:
                    code: NO_CONSUMPTION_DATA_FOR_SOLAR_LOCATION
                    transaction_id: 0HN1O72JU5P3C:00000001
                    description: Solar panels are selected for this location, but we do not have consumption data in our platform.
                At least daily resolution required:
                  value:
                    code: DAILY_RESOLUTION_OR_BETTER_REQUIRED_FOR_CUSTOM_PERIOD
                    transaction_id: 0HN1O72JU5P3C:00000001
                    description: Daily or hourly resolution required for the requested period.
                From later than today:
                  value:
                    code: FROM_DATE_CANNOT_BE_LATER_THAN_TODAY_DATE
                    transaction_id: 0HN1O72JU5P3C:00000001
                    description: From date cannot be larger than todays date.
                Timespan too large:
                  value:
                    code: TIMESPAN_TOO_LARGE
                    transaction_id: 0HN1O72JU5P3C:00000001
                    description: Timespan too large, one year or 366 days is the maximum allowed.
                Timespan too small:
                  value:
                    code: TIMESPAN_TOO_SMALL
                    transaction_id: 0HN1O72JU5P3C:00000001
                    description: Timespan must be at least 28 days.
                Current month not supported:
                  value:
                    code: EUC_FOR_CURRENT_MONTH_IS_NOT_SUPPORTED
                    transaction_id: 0HN1O72JU5P3C:00000001
                    description: EUC for current month is not supported.
                Period spanning several months have mid-month from/to dates.:
                  value:
                    code: MULTI_MONTH_DATES_START_MID_MONTH
                    transaction_id: 0HN1O72JU5P3C:00000001
                    description: When requesting EUC for a period larger than 1 month, or 31 days, from and to dates must
                      start on the 1st day of the month.
                Monetary value not calculated:
                  value:
                    code: COST_NOT_FOUND_FOR_ALL_DATA_POINTS
                    transaction_id: 0HN1O72JU5P3C:00000001
                    description: Monetary value could not be calculated
                From parameter missing:
                  value:
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    description: Parameter 'from' missing
                To parameter missing:
                  value:
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    description: Parameter 'to' missing
                Date range invalid:
                  value:
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    description: Parameter 'from' cannot be larger than 'to'
                From parameter timezone unsupported:
                  value:
                    code: INVALID_PARAMETER
