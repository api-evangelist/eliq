  /v3/locations/{locationId}/notifications/settings/{notificationTypeId}:
    put:
      tags:
      - Locations
      summary: Update notification settings per location.
      description: "Can be used to enable/disable the notification and configure delivery channels.\r\n            \r\nAn\
        \ important note is that the notification is sent via all configured channels.\r\nI.E. if none of the channels (email,\
        \ text, push, webhook) are muted, ALL of them will be used in order to deliver the notification."
      operationId: put-v3-locations-locationId-notifications-settings
      parameters:
      - name: locationId
        in: path
        description: Location id
        required: true
        schema:
          type: integer
          format: int32
      - name: notificationTypeId
        in: path
        description: Notification id
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/LocationNotificationSettingsInput'
          application/json:
            schema:
              $ref: '#/components/schemas/LocationNotificationSettingsInput'
          text/json:
            schema:
              $ref: '#/components/schemas/LocationNotificationSettingsInput'
          application/*+json:
            schema:
              $ref: '#/components/schemas/LocationNotificationSettingsInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettingsResponse'
              examples:
                Notification update successful:
                  value:
                    notification_name: daily_anomaly
                    notification_type_id: 90
                    send_event_notification: false
                    send_email: true
                    send_push: true
                    send_text: false
                    send_webhook: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Input not provided:
                  value:
                    code: invalid_parameter
                    transaction_id: 0HN1O72JU5P3C:00000001
                    description: '''input'' cannot be null'
                Notification type id not provided:
                  value:
                    code: invalid_parameter
                    transaction_id: 0HN1O72JU5P3C:00000001
                    description: '''notificationTypeId'' not provided'
