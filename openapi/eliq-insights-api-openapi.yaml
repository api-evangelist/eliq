      operationId: get-v3-locations-locationId-homeprofile
      description: "### Home profile endpoints are being DEPRECATED\n\nEliq is expanding it's suite of features to include\
        \ business insights. In light of this, new Location Profile endpoints were introduced in order to deferentiate locations\
        \ between residential and business locations.\n\nThe new Location profile endpoints should be used to manage home\
        \ profile properties. Eliq will continue to support this endpoint and will communicate a date when this endpoint will\
        \ no longer be supported once a date has been set.\n\nGet location home profile. The endpoint will return both meta\
        \ data about the available home profile options that is available, and the selected properties for the specific location.\n\
        \nA location home profile is used to populate information about the household, such as house type, heating type or\
        \ number of people in the household. The available home profile options is dependent on the country of the location.\
        \ There is also a possibility to modify the available home profile options. Please contact Eliq for more information.\
        \ \n\nNOTE: In the 'properties' section, certain values, such as 'hotwater_type', represent different fuel options\
        \ like electricity or gas for the hot water system. However, if you have a hot water system that operates without\
        \ consuming energy, like wood burning, you can omit selecting any specific value for the 'hotwater_type' field."
      tags:
      - Home Profile
      deprecated: true
    patch:
      summary: Update home profile
      operationId: patch-v3-locations-locationId-homeprofile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeProfileOption'
              examples:
                Home profile:
                  value:
                    key: house_type
                    data_type: single_select
                    is_required: false
                    value: apartment
                    possible_values:
                    - value: house
                      developer_description: House
                    - value: apartment
                      developer_description: Apartment
                    tags:
                    - required_for_euc_to_work
                    - required_for_sh_to_work
                    developer_description: Type of dwelling
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Error not found:
                  value:
                    type: client_error
                    category: entity_not_found
                    description: Could not find location
                    message: 'Something went wrong, please try again later. If problem remains, please contact support (error:
                      1ad3a534117d4).'
                    transaction_id: 37c4ef86-d525-42c8-b65f-9b4cfcce0df6
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchDocument'
            examples:
              Replace housetype, people, heating type:
                value:
                - op: replace
                  path: properties/house_type
                  value: apartment
                - op: replace
                  path: properties/persons
                  value: 2
                - op: replace
                  path: properties/heating_type_primary
                  value: radiators
        description: ''
      description: '### Home profile endpoints are being DEPRECATED


        Eliq is expanding it''s suite of features to include business insights. In light of this, new Location Profile endpoints
        were introduced in order to deferentiate locations between residential and business locations.


        The new Location profile endpoints should be used to manage home profile properties. Eliq will continue to support
        this endpoint and will communicate a date when this endpoint will no longer be supported once a date has been set.


        Update the homeprofile.


        Follows RFC 6902 with the small tweak that we only allow the replace operation. However, the replace operation can
        be used to add and remove as well.


        See the example for GetLocationHomeprofile for specifications of what values can be set for each property.


        NOTE: In the ''properties'' section, certain values, such as ''hotwater_type'', represent different fuel options like
        electricity or gas for the hot water system. However, if you have a hot water system that operates without consuming
        energy, like wood burning, you can omit selecting any specific value for the ''hotwater_type'' field.'
      tags:
      - Home Profile
      deprecated: true
