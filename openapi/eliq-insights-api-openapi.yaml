      operationId: get-v3-locations-locationId-production
      description: 'Get energy production for the location. Whether location production data exists, and between which dates,
        can be found in the meta data in /locations/{locationId} endpoint. The production will be a summary of all production
        for a location, meaning that in case of multiple pv systems installed, this will return the total energy.


        Maximum time spans for resolutions


        * 6min: 7 days

        * 15min: 7 days

        * 30min: 7 days

        * hour: 93 days

        * day: 5 years

        * month: 5 years


        `NOTE!` For cost to be available as a unit type, the location prices must be set in our database. If no location prices
        are available there will be an error response.'
      parameters:
      - schema:
          type: string
          enum:
          - elec
          - gas
          - district_heating
          default: elec
          example: elec
        in: query
        name: fuel
        description: Fuel. Defaults to 'elec'
      - schema:
          type: string
          default: energy
          enum:
          - energy
          - cost
          example: energy
        in: query
        name: unit
        description: Unit. Defaults to 'energy'
      - schema:
          type: string
          enum:
          - 6min
          - 15min
          - 30min
          - hour
          - day
          - month
          example: day
        in: query
        name: resolution
        description: Resolution of data
        required: true
      - schema:
          type: string
          example: '2021-01-01T00:00:00'
          format: date-time
        in: query
        name: from
        description: From date
        required: true
      - schema:
          type: string
          format: date-time
          example: '2021-02-01T00:00:00'
        in: query
        name: to
        description: The 'to date' represents the end date of the time period. The value is exclusive, indicating that the
          specified date is not included in the data range. It is rounded down to the closest start of the period for the
          given resolution.
        required: true
      tags:
      - Energy Data
