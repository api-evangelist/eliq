  /v3/users/{userId}/connections:
    parameters:
    - schema:
        type: integer
      name: userId
      in: path
      required: true
      description: Eliq internal id of user
    get:
      summary: Get User Connections
      operationId: get-v3-users-userId-connections
      description: 'Get all connections associated with a user.


        ### Connection statuses


        | *Status* | *Description* |

        | --- | --- |

        | connected | The connection is connected, which means Eliq have access to manage connection entities for the connection.
        |

        | awaiting_confirmation | A connection request has been generated, but not yet approved. This may be due to that the
        grid operator need to approve the request, or a user action is required. |

        | disconnected | Eliq has lost access to the connection. User input is needed which is managed in Eliq Connect Web.
        |'
      tags:
      - Eliq Connect
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'
              examples:
                Example:
                  value:
                  - id: 20b4adc8-2ae9-4f99-b50d-af0933042f58
                    display_name: Connection display name
                    provider: provider_name
                    status: connected
