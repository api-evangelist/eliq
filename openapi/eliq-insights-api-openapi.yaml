  /v3/locations/{locationId}/budgets:
    parameters:
    - schema:
        type: string
      name: locationId
      in: path
      required: true
    get:
      summary: Get location budgets
      tags:
      - Budgets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Budget'
              examples:
                Example - No budgets enabled:
                  value:
                  - enabled: false
                    type: budget_monthly
                    fuel: elec
                    resolution: month
                    unit: energy
                Example - Awaiting first run:
                  value:
                  - enabled: true
                    type: budget_weekly
                    fuel: elec
                    resolution: week
                    unit: energy
                    limit: 200000
                    status:
                      forecast: null
                      value: null
                      result: null
                      code: not_ok
                      action:
                        code: budget_awaiting_first_run
                        description: Budget is awaiting first run
                Example - Runned:
                  value:
                  - enabled: true
                    type: budget_weekly
                    fuel: elec
                    resolution: week
                    unit: energy
                    limit: 200000
                    config:
                      mode: manual
                      margin_percent: null
                    status:
                      code: ok
                      result: currently_below
                      value: 16370
                      forecast: 120000
                      period_start: '2020-05-11T00:00:00'
                      period_end: '2020-05-18T00:00:00'
                      data_until: '2020-05-13T00:00:00'
                Example - Auto budget:
                  value:
                  - enabled: true
                    type: budget_monthly
                    fuel: elec
                    resolution: month
                    unit: energy
                    limit: 144000
                    config:
                      mode: auto
                      margin_percent: 20
                    series:
                      fuel: elec
                      unit: energy
                      resolution: month
                      from: '2020-05-01T00:00:00'
                      to: '2020-06-01T00:00:00'
                      consumption_cumulative:
                      - 12000
                      - 28000
                      - 41000
                      - null
                      forecast_cumulative:
                      - 30000
                      - 60000
                      - 90000
                      - 120000
                    status:
                      code: ok
                      result: currently_below
                      value: 41000
                      forecast: 120000
                      period_start: '2020-05-01T00:00:00'
                      period_end: '2020-06-01T00:00:00'
                      data_until: '2020-05-13T00:00:00'
      operationId: get-v3-locations-locationId-budgets
      description: 'Get a locations budgets. If a budget is enabled, the budget is active and will have a limit value.


        The result of the last run will be in the ''status'' field. If ''status.code'' is "ok", values of the last run will
        be shown. If ''status.code'' is "not_ok", the budget have not been running or something went wrong during the last
        run.'
      parameters:
      - schema:
          type: string
          enum:
          - elec
          - gas
          - district_heating
        in: query
        name: fuel
        description: Optional. Fuel to get budgets for.
      - schema:
          type: string
          enum:
          - energy
          - cost
        in: query
        name: unit
        description: Optional. Unit to get budgets for.
      - schema:
          type: string
          enum:
          - week
          - month
        in: query
        name: resolution
        description: Optional. Resolution to get budgets for
    put:
      summary: Update location budgets
      operationId: put-v3-locations-locationId-budgets
      responses:
        '200':
          description: OK
      description: Update a locations budget. A budget is unique by providing fuel, resolution and unit. To update a budget,
        all of these needs to be specified in the query parameters.
      parameters:
      - schema:
          type: string
          example: elec
          enum:
          - elec
          - gas
          - district_heating
        in: query
        name: fuel
        required: true
        description: Fuel
      - schema:
          type: string
          enum:
          - energy
          - cost
          example: energy
        in: query
        name: unit
        description: Unit
        required: true
      - schema:
          type: string
          enum:
          - week
          - month
          example: month
        in: query
        name: resolution
        description: 'Resolution '
        required: true
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              x-examples:
                example-1:
                  enabled: true
                  limit: 200000
              properties:
                enabled:
                  type: boolean
                  description: Whether to enable or disable budget
                limit:
                  type: number
                  description: The limit to be set. Required when mode is 'manual'; ignored when mode is 'auto' (the limit
                    is derived from the forecast).
                  example: 20000
                mode:
                  type: string
                  description: 'Optional. How the budget limit is determined. Defaults to `manual` when omitted (backwards
                    compatible).

                    - `manual`: use the provided `limit`.

                    - `auto`: derive the limit automatically from the forecast at the start of each period using `margin_percent`.'
                  enum:
                  - manual
                  - auto
                  example: auto
                margin_percent:
                  type: number
                  description: Optional. Percentage applied over the forecast when mode is 'auto'. Clamped server-side to
                    [-50, 50]. Defaults to 20 when omitted.
                  example: 20
              required:
              - enabled
            examples:
              Example - Manual limit:
                value:
                  enabled: true
                  limit: 200000
              Example - Auto with default margin:
                value:
                  enabled: true
                  mode: auto
              Example - Auto with custom margin:
                value:
                  enabled: true
                  mode: auto
                  margin_percent: 10
      tags:
      - Budgets
  /v3/locations/{locationId}/budgets/history:
    parameters:
    - schema:
        type: string
      name: locationId
      in: path
      required: true
    get:
      summary: Get location budget history
      operationId: get-v3-locations-locationId-budgets-history
      tags:
      - Budgets
      description: 'Get past budget periods for a location as aligned time series. Each entry in `limit` and `consumption`
        corresponds to one period between `from` and `to` at the given `resolution`.


        Clients derive each period''s result by comparing `consumption[i]` to `limit[i]` (at or below the limit = within budget,
        above = over budget).'
      parameters:
      - schema:
          type: string
          enum:
          - elec
          - gas
          - district_heating
          example: elec
        in: query
        name: fuel
        description: Fuel to get budget history for.
        required: true
      - schema:
          type: string
          enum:
          - energy
          - cost
          example: energy
        in: query
        name: unit
        description: Unit to get budget history for.
        required: true
      - schema:
          type: string
          enum:
          - week
          - month
          example: month
        in: query
        name: resolution
        description: Resolution to get budget history for.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetHistory'
              examples:
                Example:
                  value:
                    fuel: elec
                    unit: energy
                    resolution: month
                    from: '2020-01-01T00:00:00'
                    to: '2020-04-01T00:00:00'
                    limit:
                    - 200000
                    - 200000
                    - 180000
                    consumption:
                    - 187500
                    - 213000
                    - 165200
