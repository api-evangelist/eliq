components:
  schemas:
    Address:
      required:
      - country_code
      - street_address
      type: object
      properties:
        street_address:
          minLength: 1
          type: string
          description: Street address.
          example: Riksgatan 1
        postal_code:
          type: string
          description: Postal code.
          nullable: true
          example: 117 40
        city:
          type: string
          description: City name.
          nullable: true
          example: Stockholm
        country_code:
          minLength: 1
          type: string
          description: Country code (ISO 3166-1 alpha-2).
          example: SE
        lon:
          type: number
          description: The geographical longitude coordinate.
          format: double
          nullable: true
          example: 18.07187
        lat:
          type: number
          description: The geographical latitude coordinate.
          format: double
          nullable: true
          example: 59.3257
      description: General address data including latitude and longitude.
    User:
      description: Get user information
      type: object
      x-examples:
        example-1:
          id: 1234
          ext_ref: aec78361-f5b6-44cc-b9e6-935bd5053592
          forname: John
          surname: Doe
          phone: '987643212'
          email: john.doe@email.com
          language_code: en-GB
      examples:
      - id: 1234
        ext_ref: aec78361-f5b6-44cc-b9e6-935bd5053592
        name: John
        phone: '+46731234123'
        email: john.doe@email.com
        language_code: en-GB
      properties:
        id:
          type: number
          example: 1234
          description: Eliq internal ID
        client_id:
          type: number
          example: 123456789
          description: Eliq internal Client ID
        ext_ref:
          type: string
          minLength: 1
          description: Eliq external reference. Client's user ID (ID in data management API)
          example: aec78361-f5b6-44cc-b9e6-935bd5053592
        name:
          type: string
          example: John
          description: Users name
        forename:
          type: string
          deprecated: true
          description: Users forename
        surname:
          type: string
          deprecated: true
          description: Users surname
        phone:
          type: string
          example: '+46731234123'
          description: User phone number
        email:
          type: string
          example: john.doe@email.com
          format: email
          description: User email
        language_code:
          type: string
          minLength: 1
          example: en-GB
          description: Users selected language code. Translations shown in app and messages will be sent in this language
      required:
      - id
      - ext_ref
      - language_code
    Consent:
      type: object
      x-examples:
        example-1:
          version_id: f2283b35-c2c7-4a4f-90f4-49e493c69d7
          name: terms_and_conditions
          type: login_consent
          given_consent: false
          is_updated: true
          is_mandatory: true
          timestamp: '2022-06-28T13:54:43.369558Z'
          language_code: en-GB
          data:
            url: https://your-website-url.com/terms-and-conditions
      properties:
        version_id:
          type: string
        name:
          type: string
        type:
          type: string
        given_consent:
          type: boolean
        is_updated:
          type: boolean
        is_mandatory:
          type: boolean
        timestamp:
          type: string
        language_code:
          type: string
        data:
          type: object
          properties:
            url:
              type: string
              description: Nullable, such as the terms and conditions page on a website, etc.
      examples: []
    Location:
      required:
      - address
      - ext_ref
      - fuels
      - id
      - meters
      - timezone
      type: object
      properties:
        id:
          type: integer
          description: ID
          format: int32
          example: 150
        name:
          type: string
          description: Name
          nullable: true
          example: My Location
        ext_ref:
          minLength: 1
          type: string
          description: External (utility) reference.
        timezone:
          minLength: 1
          type: string
          description: Iana timezone
          example: Europe/Berlin
        address:
          $ref: '#/components/schemas/Address'
        fuels:
          $ref: '#/components/schemas/LocationFuels'
        meters:
          type: array
          items:
            $ref: '#/components/schemas/LocationMeter'
          description: Meters present at a location.
      description: Location data.
    LocationFuel:
      type: object
      properties:
        import:
          $ref: '#/components/schemas/LocationFuelItem'
        export:
          $ref: '#/components/schemas/LocationFuelItem'
        consumption:
          $ref: '#/components/schemas/LocationFuelItem'
        production:
          $ref: '#/components/schemas/LocationFuelItem'
      description: Fuel data
    LocationFuelItem:
      required:
      - resolution
