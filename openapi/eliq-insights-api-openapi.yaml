  /v3/locations/{locationId}/consumption:
    get:
      tags:
      - Energy Data
      summary: Get Location consumption
      description: "Get energy consumption for the location. Whether location consumption data exists, and between which dates,\
        \ can be found in the meta data in /locations/{locationId} endpoint.\r\n            \r\nMaximum time spans for resolutions:\r\
        \n* 6min: 7 days\r\n* 15min: 7 days\r\n* 30min: 7 days\r\n* hour: 93 days\r\n* day: 5 years\r\n* month: 5 years\r\n\
        \            \r\nNOTE! For cost to be available as a unit type, the location prices must be set in our database. If\
        \ no location prices are available there will be an error response.\r\n\r\nNOTE! Unit of m3 is only available with\
        \ fuel of gas. Conversion between m3 and Wh values relies on a calorific rate being configured for a client. Please\
        \ contact Eliq for more details about having this configuration in place."
      operationId: get-v3-locations-locationId-consumption
      parameters:
      - name: locationId
        in: path
        description: Location identifier
        required: true
        schema:
          type: integer
          format: int32
      - name: from
        in: query
        description: From date
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: To date, exclusive
        schema:
          type: string
          format: date-time
      - name: resolution
        in: query
        description: 'Data granularity resolution. Valid values: ''6min'', ''15min'', ''30min'', ''hour'', ''day'', ''month''.'
        schema:
          type: string
      - name: cost_type
        in: query
        description: "Only applicable when 'cost' unit is passed. Specifies the consumption cost type to return.\r\n     \
          \        If set to 'price_formula', price formulas are used to calculate the consumption costs.\r\n            \
          \ If set to 'average_cost', the costs are calculated based on the average electricity price for the provided period."
        schema:
          type: string
          default: price_formula
      - name: fuel
        in: query
        description: 'Fuel. Valid values: ''elec'', ''gas''.'
        schema:
          type: string
          default: elec
      - name: unit
        in: query
        description: 'Unit. Valid values: ''cost'', ''energy''.'
        schema:
          type: string
          default: energy
      - name: include_incomplete
        in: query
        description: Includes periods with incomplete data if set to true.
        schema:
          type: boolean
          default: true
      - name: include_co2
        in: query
        description: Includes co2 emissions data if set to true.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSeriesData'
              examples:
                Monthly energy response:
                  value:
                    consumption:
                    - 446.37
                    - null
                    resolution: month
                    fuel: elec
                    unit: energy
                    from: '2021-01-01T00:00:00'
                    to: '2021-03-01T00:00:00'
                Monthly cost response:
                  value:
                    consumption:
                    - 33.29
                    - null
                    resolution: month
                    fuel: elec
                    unit: cost
                    from: '2021-01-01T00:00:00'
                    to: '2021-03-01T00:00:00'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid parameter unit:
                  value:
                    type: client_error
                    category: invalid_parameter
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: 'Invalid parameter ''unit'': The value <argument> is not valid.'
                Invalid parameter resolution:
                  value:
                    type: client_error
                    category: invalid_parameter
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: 'Invalid parameter ''resolution'': The value <argument> is not valid.'
                Invalid parameter cost_type:
                  value:
                    type: client_error
                    category: invalid_parameter
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: 'Invalid parameter ''cost_type'': The value <argument> is not valid.'
                Invalid parameter fuel:
                  value:
                    type: client_error
                    category: invalid_parameter
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: 'Invalid parameter ''fuel'': The value <argument> is not valid.'
                From parameter missing:
                  value:
                    type: client_error
                    category: invalid_parameter
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: Parameter 'from' missing
                To parameter missing:
                  value:
                    type: client_error
                    category: invalid_parameter
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: Parameter 'to' missing
                Date range invalid:
                  value:
                    type: client_error
                    category: invalid_parameter
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: Parameter 'from' cannot be larger than 'to'
                From parameter timezone unsupported:
