                Location not found:
                  value:
                    code: LOCATION_NOT_FOUND
                    transaction_id: 0HN1O72JU5P3C:00000001
                    description: Location not found
                Location owner not found:
                  value:
                    code: LOCATION_OWNER_NOT_FOUND
