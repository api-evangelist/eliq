      type: object
      x-examples:
        example-1:
          type: monthly_insight
          id: 123456
          read: false
          created_date: '2021-05-17T13:35:22.473'
          header: Ny månadsrapport
          content: 'Hej Eva!

            Din energianvändning för..'
          object: null
