          example: monthly_insight
        id:
          type: number
          description: Eliq internal ID of the notification
          example: 123456
        read:
          type: boolean
          description: Could be used to indicate it the notification is read or not. Needs to be used together with PATCH
            notifications.
          default: true
        created_date:
          type: string
          minLength: 1
          description: 'The date when the notification was created. The date is in UTC (Z flag is missing due to design mistake
