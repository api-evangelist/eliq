  /v3/locations/{locationId}/peakpower/{resolution}:
    get:
      tags:
      - Energy Data
      summary: Get location peak power
      description: "Get energy peak power for the location. Whether location peak power data exists, and between which dates,\
        \ can be found in the meta data in /locations/{locationId} endpoint.\r\n\r\nMaximum time spans for resolutions:\r\n\
        * hour: 5 years\r\n* day: 5 years\r\n* month: 5 years\r\n\r\nImport, export, consumption and production response properties\
        \ are deprecated, please use the *power* property."
      operationId: get-v3-locations-locationId-peakpower
      parameters:
      - name: locationId
        in: path
        description: Location id
        required: true
        schema:
          type: integer
          format: int32
      - name: resolution
        in: path
        description: Data resolution
        required: true
        schema:
          type: string
      - name: peak_power_resolution
        in: query
        description: Resolution of peak power values
        required: true
        schema:
          type: string
      - name: from
        in: query
        description: From date
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: To date, exclusive
        required: true
        schema:
          type: string
          format: date-time
      - name: fuel
        in: query
        description: Fuel type
        schema:
          enum:
          - elec
          - gas
          - district_heating
          type: string
          description: Fuel type
          default: elec
      - name: direction
        in: query
        description: Type of meter
        schema:
          enum:
