  /v3/locations/{locationId}/profile/{profileValueId}:
    patch:
      tags:
      - Location Profile
      summary: Patch location profile's value
      description: "This endpoint can be used to update a specific location profile's value.\r\n            \r\nWe strongly\
        \ recommend using this endpoint only for correcting mistakes a user has made while entering his location profile and\
        \ using the [POST Add new location profile values](#tag/Location-Profile/operation/set-v3-location-profile-values)\
        \ endpoint in order to create historic change entries of the location profile.\r\n            \r\nFor example:\r\n\
        A user has entered that he has 2 electric boilers at his location when he actually meant 1. This can be corrected\
        \ using [PATCH location profile's value](#tag/Location-Profile/operation/patch-v3-location-profile-value).\r\nIn the\
        \ scenario where the user has had a single boiler since 2022-01-01, and decided to purchase a 2nd boiler on 2024-01-01,\
        \ we recommend using [POST Add new location profile values](#tag/Location-Profile/operation/set-v3-location-profile-values)\
        \ to make use of the historic location profile feature."
      operationId: patch-v3-location-profile-value
      parameters:
      - name: locationId
        in: path
        description: Location id
        required: true
        schema:
          type: integer
          format: int32
      - name: profileValueId
        in: path
        description: Profile value id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: PATCH request model
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/PatchLocationProfileRequestModel'
            examples:
              Payload with string value:
                value:
