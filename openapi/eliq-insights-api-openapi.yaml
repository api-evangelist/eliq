  /v3/locations/{locationId}/marketprice/prices:
    get:
      tags:
      - Market Price
      summary: Get location market prices
      description: Get market prices for location in desired resolution between two specified timestamps. On daily and monthly
        resolution, the average price is calculated for the given day/month using either hourly or 15min prices, depending
        on which prices are available.
      operationId: get-v3-locations-locationId-marketprice-prices
      parameters:
      - name: locationId
        in: path
        description: Location ID
        required: true
        schema:
          type: integer
          format: int32
      - name: from
        in: query
        description: From date inclusive
        schema:
          type: string
      - name: to
        in: query
        description: To date exclusive
        schema:
          type: string
      - name: resolution
        in: query
        description: 'Data granularity resolution with the following valid values: ''15min'', ''30min'', ''hour'', ''day'',
          ''month'''
        schema:
          enum:
          - 15min
          - 30min
          - hour
          - day
          - month
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketPriceResponseDto'
              examples:
                Successful day result:
                  value:
                    resolution: day
                    currency: SEK
                    from: '2022-09-01T00:00:00'
                    to: '2022-09-02T00:00:00'
                    values:
                    - period_start: '2022-09-02T00:00:00'
                      price_kwh: 1.406281
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                From date missing:
                  value:
                    code: MISSING_FROM
                    transaction_id: 0HN18NIB8K5RV:00000001
                    description: From date missing
                To date missing:
                  value:
                    code: MISSING_TO
                    transaction_id: 0HN18NIB8K5RV:00000001
                    description: To date missing
                To date must be after from date:
                  value:
                    code: TO_MUST_BE_AFTER_FROM
                    transaction_id: 0HN18NIB8K5RV:00000001
                    description: To date must be after from date
                Resolution missing:
                  value:
                    code: MISSING_RESOLUTION
                    transaction_id: 0HN18NIB8K5RV:00000001
                    description: Resolution missing
                Resolution provided invalid:
                  value:
                    code: INVALID_RESOLUTION
                    transaction_id: 0HN18NIB8K5RV:00000001
                    description: Resolution provided invalid
                Period too long:
                  value:
                    code: PERIOD_TOO_LONG
                    transaction_id: 0HN18NIB8K5RV:00000001
                    description: Period requested too long for given resolution
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Location not found:
                  value:
                    code: LOCATION_NOT_FOUND
                    transaction_id: 0HN18NIB8K5RV:00000001
                    description: Location with given id not found
                Location missing spot price region:
                  value:
                    code: LOCATION_MISSING_SPOT_PRICE_REGION
                    transaction_id: 0HN18NIB8K5RV:00000001
                    description: Location missing spot price region
                Spot price region not found:
                  value:
                    code: SPOT_PRICE_REGION_NOT_FOUND
                    transaction_id: 0HN18NIB8K5RV:00000001
                    description: Spot price region not found
  /v3/locations/{locationId}/marketprice/price-summary:
    get:
      tags:
      - Market Price
      summary: Get location market price summary
      description: "Get market price summary in daily or monthly resolution. The summary includes: average market price, the\
        \ lowest and highest market price for the period and price levels. The price levels indicates if the average market\
        \ price was high or low for the period compared to a reference period.\r\n\r\nIn daily resolution the lowest and highest\
        \ market price are hourly and the price levels reference period is default 30 days.\r\n\r\nIn monthly resolution the\
        \ lowest and highest market price are daily average and the price levels reference period is default 12 months.\r\n\
        \r\nNote! In order for market prices to be available, the property spot_price_region_id must be set on the location\
        \ via the <a href=\"https://developer.eliq.com/api-reference/data-mgmt-api/\">Data Management API</a>."
      operationId: get-v3-locations-locationId-marketprice-price-summary
      parameters:
      - name: locationId
        in: path
        description: Location Id
        required: true
        schema:
          type: integer
          format: int32
      - name: from
        in: query
        description: From date
        required: true
        schema:
          type: string
      - name: to
        in: query
        description: To date exclusive
        required: true
        schema:
          type: string
      - name: resolution
        in: query
        description: 'Data granularity resolution of periods to summarise with the following valid values: ''day'', ''month'''
        required: true
        schema:
          enum:
          - day
          - month
          type: string
      - name: subResolution
        in: query
        description: Optional parameter which specifies the sub-resolution of the summary data. For 'day' resolution, valid
          values are 'hour' and '15min'. For 'month' resolution, the only valid value is 'day'. If parameter isn't provided,
          it defaults to 'hour' for 'day' resolution and 'day' for 'month' resolution.
