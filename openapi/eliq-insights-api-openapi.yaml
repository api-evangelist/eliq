          description: Specify whether push notification delivery to a user's smartphone should be muted. True - not delivered,
            False - delivered.
          nullable: true
        mute_webhook:
          type: boolean
          description: Specify whether webhook delivery should be muted. True - not delivered, False - delivered.
          nullable: true
