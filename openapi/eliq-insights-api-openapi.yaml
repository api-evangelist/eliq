      in: path
      required: true
    get:
      summary: Get connection entities
      tags:
      - Eliq Connect
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectionEntity'
              examples:
                Example:
                  value:
                  - id: 20b4adc8-2ae9-4f99-b50d-af0933042f58
                    display_name: Electricity meter
                    type: meter
                    location_id: 1234
                    meter:
                      fuel: elec
                      type: import
                      supply_start_date: '2021-01-01'
                      supply_end_date: '2022-01-01'
                      data_available_from_date: '2021-01-01'
                      data_available_to_date: '2022-06-05'
      operationId: get-v3-connections-connectionId-connection-entities
      description: "Get all (configured) entities associated with the connection. \n\nA connection may have several entities\
        \ associated with it. In some scenarios, the configuration of these connection entities needs to be done by the end-user.\
        \ This opens up the possibility that some entities are not configured in Eliq for a connection - only configured entities\
        \ will be available in this endpoint. "
  /v3/locations/{locationId}/connection-meta-data:
    parameters:
    - schema:
        type: string
      name: locationId
      in: path
      required: true
    get:
      summary: Get location connection meta data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionMetaData'
              examples:
                Status ok:
                  value:
                    status: ok
      operationId: get-v3-locations-locationId-connection-meta-data
      description: "Get connection meta data for a location. This endpoint enables connection logic to be handled on a location\
        \ basis, rather than on a user basis. \n\n### Connection meta-data statuses\n\n| *Status* | *Description* |\n| ---\
        \ | --- |\n| ok | The connection related to the location is all ok. Connection entities (at least one) have been configured\
        \ and data is available. No actions needed by the user.  |\n| not_connected | There are no connection related to the\
        \ location. The user should be prompted with a message asking to setup a connection. Send the user of to Eliq Connect.\
        \ |\n| action_required | A connection exist, but there is an action required by the user to make it work. The user\
        \ should be prompted with a message saying he/she needs to fill in some more information, and send the user of to\
        \ Eliq Connect. |\n| awaiting_confirmation | Connection created, but not yet validated by the provider. E.g. awaiting\
        \ approval from DSO. At this stage, there are no actions that can be done to change the status. Prompt message that\
        \ a process has been started. |\n| awaiting_first_data_sync | The connection has been configured and is ready to go.\
        \ Energy data has though not been synced for the at least one of the connection entities. |"
      tags:
      - Eliq Connect
