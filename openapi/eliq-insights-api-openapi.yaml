    post:
      tags:
      - Location Profile
      summary: Add new location profile values
      description: "Used in order to add new historic values to the location profile, specifying how and when it has changed.\r\
        \n\r\nExisting values can be updated via [PATCH location profile's value](#tag/Location-Profile/operation/patch-v3-location-profile-value).\r\
        \n\r\nIf a user's location profile genuinely changed, [POST Add new location profile values](#tag/Location-Profile/operation/set-v3-location-profile-values)\
        \ should be used in order to make full use of the historic location profile feature.\r\n\r\nIt's technically possible\
        \ to omit the historic location profile functionality, use [POST Add new location profile values](#tag/Location-Profile/operation/set-v3-location-profile-values)\
        \ to create the property and [PATCH location profile's value](#tag/Location-Profile/operation/patch-v3-location-profile-value)\
        \ to update it. But we strongly recommend making use of the historic location profile functionality.\r\n         \
        \   \r\nFor example:\r\nA user has entered that he has 2 electric boilers at his location when he actually meant 1.\
        \ This can be corrected using [PATCH location profile's value](#tag/Location-Profile/operation/patch-v3-location-profile-value).\r\
        \nHowever, in the scenario where the user has had a single boiler since 2022-01-01, and decided to purchase a 2nd\
        \ boiler on 2024-01-01, [POST Add new location profile values](#tag/Location-Profile/operation/set-v3-location-profile-values)\
        \ should be used to make use of the historic profile feature."
      operationId: set-v3-location-profile-values
      parameters:
      - name: locationId
        in: path
        description: Location id
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        description: Values to add
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/LocationProfileValueRequest'
            examples:
              Payload:
                value:
                - key: house_type
                  value: apartment
                  from: '2024-09-01T00:00:00'
                - key: living_area
                  value: 450
                  from: '2024-09-01T00:00:00'
                - key: heating_type_other
                  value:
                  - heat_pump
                  - wood_burning
                  from: '2024-01-01T00:00:00'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationProfileValueResponse'
              examples:
                Location profile values result:
                  value:
                  - id: cde1e994-0b03-4a63-99ae-373becd4da3c
                    key: house_type
                    value: apartment
                    from: '2024-09-01T00:00:00'
                  - id: a9b70bd2-113b-4724-8076-5469da03eb15
                    key: living_area
                    value: 450
                    from: '2024-09-01T00:00:00'
                Location profile value (no date):
                  value:
                  - id: 57209a2d-18e9-4e68-8889-59a7d874b497
                    key: house_type
                    value: apartment
                  - id: 237bcf08-7377-4b48-9106-ec061ea7ee60
                    key: heating_type_primary
                    value: district_heating
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Empty input provided:
                  value:
                    code: INVALID_INPUT
                    transaction_id: 0HN18NIB8K5RV:00000001
                    description: Empty input provided
                Key was not provided:
                  value:
                    code: INVALID_INPUT
                    transaction_id: 0HN18NIB8K5RV:00000001
                    description: Key was not provided
                Value was not provided:
                  value:
                    code: INVALID_INPUT
                    transaction_id: 0HN18NIB8K5RV:00000001
                    description: Value was not provided for Key 'heating_type'
                Key mismatch:
                  value:
                    code: KEY_MISSING_FROM_CONFIGURATION
                    transaction_id: 0HN18NIB8K5RV:00000001
                    description: Key 'ice_makers' does not match any allowed settings
                Key date value already exists:
                  value:
                    code: KEY_DATE_VALUE_ALREADY_EXISTS
                    transaction_id: 0HN18NIB8K5RV:00000001
                    description: Key 'heating_type' with From 'null' already exists for the location
                Key date values must be unique:
                  value:
                    code: DUPLICATE_KEY_VALUE_PAIRS
                    transaction_id: 0HN18NIB8K5RV:00000001
                    description: 'Key date values must be unique for a single location. The following duplicates were found:
                      Key ''persons'' From ''2024-01-01'''
                Unsupported type:
                  value:
                    code: INVALID_INPUT_VALUE_FORMAT
                    transaction_id: 0HN18NIB8K5RV:00000001
                    description: 'Unsupported type used for number: System.String'
                Profile type not configured:
                  value:
                    code: PROFILE_TYPE_NOT_CONFIGURED
                    transaction_id: 0HN18NIB8K5RV:00000001
                    description: Profile type not configured
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Location not found:
                  value:
                    code: ENTITY_NOT_FOUND
                    transaction_id: 0HN18NIB8K5RV:00000001
                    description: Could not find the location.
                Profile settings not configured:
                  value:
                    code: PROFILE_CONFIGURATION_NOT_FOUND
                    transaction_id: 0HN18NIB8K5RV:00000001
                    description: Profile settings not configured
