                    - '2024-07-01T06:30:00'
                    - '2024-07-02T08:30:00'
                    - '2024-07-03T14:00:00'
                    - '2024-07-04T16:00:00'
                    from: '2024-07-01T00:00:00'
                    to: '2024-07-05T00:00:00'
                    fuel: elec
