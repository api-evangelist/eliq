                    description: Could not find the location.
      operationId: get-v3-locations-locationId-consumption/suggestion
      description: 'This endpoint returns the “locations annual consumption Suggestion”.


        Note: User''s home profile is required to generate this value. In order for this to work, the Eliq Platform must support the Country. Contact Eliq for an update on supported countries.


        To be able to create the estimated suggestion a set of home profile values needs to be set. This can vary from country to country but typically these values are required; persons, heating_type_primary, house_type and hotwater_type.'
