          description: 'Bad Request


            Possible errors


            | *code* | *description* |

            | --- | --- |

            | CONFIDENCE_LEVEL_PERCENTAGE_CANNOT_BE_NULL | Confidence level percentage can not be null. |

            | LOCATION_PROPERTIES_SETTINGS_IS_NOT_COMPLETE | Location home profile is not complete. |

            | INVALID_PARAMETER | Invalid parameter ''fuel''. Should be one of: elec, gas, district_heating |

            | ENTITY_NOT_FOUND | Could not find the location. |'
