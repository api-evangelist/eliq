          enum:
          - elec
          - gas
        in: query
        name: fuel
        description: Fuel type, currently gas is not supported in some countries
      tags:
      - Locations
  /v3/locations/{locationId}/temperature:
    parameters:
    - schema:
        type: string
      name: locationId
      in: path
      required: true
      description: Location id
    get:
      summary: Get temperature
      tags:
      - Locations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemperatureData'
              examples:
                Example:
                  value:
                    temperature:
                    - 12
                    - 13
                    resolution: month
                    from: '2021-01-01T00:00:00'
                    to: '2021-03-01T00:00:00'
        '400':
          description: 'Bad Request


            Possible errors


            | *type* | *category* | *description* |

            | --- | --- | --- |

            | client_error | invalid_parameter | Timespan between ''from'' and ''to'' to large, max {maxTimeSpan} days for the given resolution" |

            | client_error | invalid_parameter | Parameter ''to'' missing |

            | client_error | invalid_parameter | Parameter ''from'' missing |

            | client_error | invalid_parameter | Parameter ''from'' cannot be larger than ''to'' |

            | client_error | invalid_parameter | Invalid parameter ''resolution''. Should be one of: 6min, 30min, hour, day, month |'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Error:
                  value:
                    type: client_error
                    category: invalid_parameter
                    code: INVALID_PARAMETER
                    description: Invalid parameter 'to'. Cannot be null
                    message: 'Something went wrong, please try again later. If problem remains, please contact support (error: 1ad3a534117d4).'
                    transaction_id: 37c4ef86-d525-42c8-b65f-9b4cfcce0df6
      operationId: get-v3-location-temperature
      parameters:
      - schema:
          type: string
          enum:
          - day
          - month
          example: day
        in: query
        name: resolution
        description: Resolution of temperature
        required: true
      - schema:
          type: string
          example: '2021-01-01'
          format: date
        in: query
        name: from
        description: From which date to retrieve temperature
        required: true
      - schema:
          type: string
          format: date
          example: '2021-01-01'
        in: query
        name: to
        description: The 'to date' represents the end date of the time period. The value is exclusive, indicating that the specified date is not included in the data range. It is rounded down to the closest start of the period for the given resolution.
        required: true
      description: 'Get the outdoor temperature in Celsius for a location


        Maximum time spans for resolutions

        * day: 31 days

        * month: 1 year'
components:
  schemas:
    TemperatureData:
      description: Model containing time series temperature data. Different parameters will be available depending on the data requested, see below for more information
      type: object
      x-examples:
        example-1:
          consumption:
          - 446.37
          - null
          import:
          - 446.37
          - null
          export:
          - 446.37
          - null
          production:
          - 446.37
          - null
          fuel: elec
          unit: energy
          resolution: month
          from: '2019-01-01T00:00:00'
          to: '2019-03-01T00:00:00'
      examples:
      - temperature:
        - 12
        - 13
        resolution: month
        from: '2021-01-01T00:00:00'
        to: '2021-03-01T00:00:00'
      title: Temperature data
      properties:
        temperature:
          type: array
          items:
            type:
            - number
            - 'null'
        resolution:
          type: string
          minLength: 1
          description: Can be 'day' or 'month'. Matches with the value passed in query parameters of the request.
          enum:
          - day
          - month
        from:
          type: string
          minLength: 1
          description: From date
          example: '2021-01-01T00:00:00'
        to:
          type: string
          minLength: 1
          description: To date
          example: '2021-02-01T00:00:00'
      required:
      - resolution
      - from
      - to
    LocationFuelItem:
      required:
      - resolution
      - source
      type: object
      properties:
        resolution:
          minLength: 1
          type: string
          description: Energy data sampling resolution.
          example: 15min
        data_from:
          type: string
          description: Available from date.
          format: date-time
          nullable: true
          example: '2021-01-01T00:00:00'
        data_to:
          type: string
          description: Available to date.
          format: date-time
          nullable: true
          example: '2021-03-01T00:00:00'
        source:
          $ref: '#/components/schemas/FuelSource'
        sync_status:
          $ref: '#/components/schemas/SyncStatus'
      description: General data about a fuel item.
    SyncStatus:
      enum:
      - ok
      - waiting_for_data
      type: string
      description: Data synchronization status.
    Direction:
      enum:
      - import
      - export
      - consumption
      - production
      type: string
      description: Direction type
    Notification:
      description: 'Notification object. Content available in "object" is dependent on the notification type. '
      type: object
      x-examples:
        example-1:
          type: monthly_insight
          id: 123456
          read: false
          created_date: '2021-05-17T13:35:22.473'
          header: Ny månadsrapport
          content: 'Hej Eva!

            Din energianvändning för..'
          object: null
      examples:
      - type: monthly_insight
        id: 123456
        read: true
        created_date: '2021-05-17T13:35:22.473'
        header: Ny månadsrapport
        content: Hej Eva!\nDin energianvändning för..
        object:
          location_id: 1234
          location_ext_ref: '{location_ext_ref}'
          type: monthly_insight
          fuel: elec
          period_start: '2020-10-01T00:00:00.000'
          period_end: '2020-11-01T00:00:00.000'
          message:
            language:
              sv-SE:
                header: Ny månadsrapport
                content: 'Hej Eva!

                  Din energianvändning för..'
      title: Notification
      properties:
        type:
          type: string
          minLength: 1
          description: Notification type
          example: monthly_insight
        id:
          type: number
          description: Eliq internal ID of the notification
          example: 123456
        read:
          type: boolean
          description: Could be used to indicate it the notification is read or not. Needs to be used together with PATCH notifications.
          default: true
        created_date:
          type: string
          minLength: 1
          description: 'The date when the notification was created. The date is in UTC (Z flag is missing due to design mistake :)) '
          format: date-time
          example: '2021-05-17T13:35:22.473'
        header:
          type: string
          minLength: 1
          description: Header of notification. In language code set for the user
          example: Ny månadsrapport
        content:
          type: string
          minLength: 1
          description: Content of notification in language code set for the user. May contain new line marker '\n'
          example: Hej Eva!\nDin energianvändning för..
        object:
          type: object
          description: 'Object containing detailed information from the source of the notification. E.g. a monthly insights object. '
      required:
      - type
      - id
      - read
      - created_date
      - header
      - content
    NotificationSettingsResponse:
      type: object
      properties:
        notification_name:
          type: string
          description: The name of the notification
          nullable: true
        notification_type_id:
          type: integer
          description: Unique notification id
          format: int32
        notification_category:
          type: string
          description: Notification category
          nullable: true
        send_event_notification:
          type: boolean
          description: Specifies whether the notification should be sent (I.E. is the notification enabled).
          nullable: true
        send_email:
          type: boolean
          description: Specifies whether notification should be delivered by email.
          nullable: true
        send_push:
          type: boolean
          description: Specifies whether a push notification is delivered to the user's smartphone.
          nullable: true
        send_text:
          type: boolean
          description: Specifies whether the notification is sent via an SMS text message.
          nullable: true
        send_webhook:
          type: boolean
          description: Specifies whether the notification is sent via a webhook.
          nullable: true
    Location:
      required:
      - address
      - ext_ref
      - fuels
      - id
      - meters
      - timezone
      type: object
      properties:
        id:
          type: integer
          description: ID
          format: int32
          example: 150
        name:
          type: string
          description: Name
          nullable: true
          example: My Location
        ext_ref:
          minLength: 1
          type: string
          description: External (utility) reference.
        timezone:
          minLength: 1
          type: string
          description: Iana timezone
          example: Europe/Berlin
        address:
          $ref: '#/components/schemas/Address'
        fuels:
          $ref: '#/components/schemas/LocationFuels'
        meters:
          type: array
          items:
            $ref: '#/components/schemas/LocationMeter'
          description: Meters present at a location.
      description: Location data.
    Fuel:
      enum:
      - elec
      - gas
      - district_heating
      type: string
      description: Fuel type
    LocationNotificationSettingsInput:
      required:
      - notification_type_id
      type: object
      properties:
        notification_type_id:
          type: integer
          description: The unique notification id
          format: int32
        enabled:
          type: boolean
          description: Specify whether the notification is enabled. Disabled notifications are not sent.
          nullable: true
        mute_email:
          type: boolean
          description: Specify whether delivery by email should be muted. True - not delivered, False - delivered.
          nullable: true
        mute_text:
          type: boolean
          description: Specify whether delivery by SMS text message should be muted. True - not delivered, False - delivered.
          nullable: true
        mute_push:
          type: boolean
          description: Specify whether push notification delivery to a user's smartphone should be muted. True - not delivered, False - delivered.
          nullable: true
        mute_webhook:
          type: boolean
          description: Specify whether webhook delivery should be muted. True - not delivered, False - delivered.
          nullable: true
      description: 'The various settings which can be configured for a notification.

        An important note is that the notification is sent via all configured channels.

        I.E. if none of the channels (email, text, push, webhook) are muted, ALL of them will be used in order to deliver the notification.'
    LocationMeter:
      required:
      - direction
      - fuel_type
      - id
      - is_sub_meter
      - user_setup_completed
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: ID.
          example: e7c8938fe06a44a7923ed89da281705e
        model:
          minLength: 1
          type: string
          description: Model.
          example: Standard Energy V1
        user_setup_completed:
          type: boolean
          description: A true/false value depicting whether user setup is complete.
          example: true
        name_user:
          type: string
          description: Name given by the user.
          nullable: true
          example: MyName
        name_suggested:
          type: string
          description: Name suggested.
          nullable: true
          example: Standard Energy V1
        fuel_type:
          minLength: 1
          type: string
          description: Type of fuel sampled.
          example: elec
        direction:
          minLength: 1
          type: string
          description: Fuel direction.
          example: import
        is_sub_meter:
          type: boolean
          description: A true/false values depicting whether this is a sub-meter.
          example: false
        category_user:
          type: string
          description: Category which was provided by the user.
          nullable: true
          example: My Category
        category_suggested:
          type: string
          description: The category suggested.
          nullable: true
          example: other
        supply_start_date:
          type: string
          description: Supply start date.
          format: date-time
          nullable: true
          example: '2026-01-01T00:00:00'
        supply_end_date:
          type: string
          description: Supply end date.
          format: date-time
          nullable: true
          example: '2026-12-31T00:00:00'
      description: Meter data.
    Error:
      type: object
      properties:
        type:
          type: string
          description: Type of error.
          nullable: true
          example: internal_error
        category:
          type: string
          description: Error category.
          nullable: true
          example: internal_error
        code:
          type: string
          description: Code describing the issue.
          nullable: true
          example: INTERNAL_ERROR
        transaction_id:
          type: string
          description: Identifier for the session. Please provide this when contacting support.
          nullable: true
          example: 0HN18NN5QB401:00000001
        message:
          type: string
          description: A message related to the error.
          nullable: true
          example: Something went wrong. Please try again later. If problem remains, please contact support.
        description:
          type: string
          description: A description of the error for developers.
          nullable: true
          example: Internal server error, please try again later. If problem remains, please contact support.
      description: Model returned for error responses.
    FuelSource:
      enum:
      - smart_meter
      - non_smart_meter
      - load_curve_estimation
      - pv_disagg
      type: string
      description: Source of fuel data.
    Address:
      required:
      - country_code
      - street_address
      type: object
      properties:
        street_address:
          minLength: 1
          type: string
          description: Street address.
          example: Riksgatan 1
        postal_code:
          type: string
          description: Postal code.
          nullable: true
          example: 117 40
        city:
          type: string
          description: City name.
          nullable: true
          example: Stockholm
        country_code:
          minLength: 1
          type: string
          description: Country code (ISO 3166-1 alpha-2).
          example: SE
        lon:
          type: number
          description: The geographical longitude coordinate.
          format: double
          nullable: true
          example: 18.07187
        lat:
          type: number
          description: The geographical latitude coordinate.
          format: double
          nullable: true
          example: 59.3257
      description: General address data including latitude and longitude.
    YearlyEstimate:
      required:
      - fuel
      - source
      - type
      - year
      type: object
      properties:
        fuel:
          $ref: '#/components/schemas/Fuel'
        type:
          $ref: '#/components/schemas/Direction'
        year:
          type: integer
          description: Year
          format: int32
        source:
          minLength: 1
          type: string
          description: Source of the entry, e.g., user, system
        energy_wh:
          type: integer
          description: Energy in Wh
          format: int32
          nullable: true
      description: Model containing yearly estimate for a location
    LocationFuels:
      type: object
      properties:
        elec:
          $ref: '#/components/schemas/LocationFuel'
        gas:
          $ref: '#/components/schemas/LocationFuel'
        district_heating:
          $ref: '#/components/schemas/LocationFuel'
      description: Available fuel data
    LocationFuel:
      type: object
      properties:
        import:
          $ref: '#/components/schemas/LocationFuelItem'
        export:
          $ref: '#/components/schemas/LocationFuelItem'
        consumption:
          $ref: '#/components/schemas/LocationFuelItem'
        production:
          $ref: '#/components/schemas/LocationFuelItem'
      description: Fuel data
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: The Eliq insights API uses bearer tokens to authenticate requests. Read more under Authentication tag.
