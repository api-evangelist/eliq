openapi: 3.2.0
info:
  title: Eliq Data Management Portfolio Users API
  description: '# API Reference


    The Eliq data management API is organized around REST. The API accepts JSON-encoded request bodies, returns JSON-encoded responses and uses standard HTTP response codes. The URLs are all resource oriented around Eliq''s three main entities; User, Location and Meter


    # Errors


    Eliq Integration API uses standard HTTP response codes to indicate success or failure of a request. Codes with 2xx indicate success, 4xx indicate error due to invalid input, and 5xx indicates an error in Eliq Integration API.


    ## Status codes


    *Status code* | *Description*

    --- | ---

    200 - OK | Everything worked as expected.

    201 - Created | Resource created.

    202 - Accepted | Successful request, and will be handled later. A reference id will be available in the response body.

    204 - No Content | Successful request. Used in successful delete requests

    400 - Bad Request | Request input data is invalid.

    401 - Unauthorized | Access token invalid for the given request. Eg. access token expired.

    404 - Not Found | Requested resource not found

    500, 502, 503, 504 | Something wrong with Eliq Integration API


    ## Error body


    Eliq Integration API returns an error response body on failures to provide additional information on the error. Please find the error body and description below.


    ```json

    {

    "code":"",

    "description":"",

    "request_id":"16a3ae43-ca5f-455e-9aef-f93679bedc8d"

    }

    ```


    *Field* | *Type* | *Description*

    --- | --- | ---

    code | String | Error code. Possible error codes per request can be found in each request section. Error codes do not change, and can be used to tie actions to.

    description | String | A description of the error for developers

    request_id | String | Identifier of the request. Passed when in contact with support


    ## Request ID


    Each API request has an associated request id. You can find this value in the response headers, under X-Request-Id. The request id can be used in communication with Eliq support.'
  contact:
    name: Support
    email: support_b2b@eliq.com
  version: 1.5.2
tags:
- name: Portfolio Users
paths:
  /portfolio/accounts/{accountId}/users/{id}:
    put:
      tags:
      - Portfolio Users
      summary: Create or update portfolio user
      description: 'Create or update user on an account for the portfolio.

        If a user with the given id does not exist on the account, a new account user will be created.

        If a user with id exists on the account, that user will be updated.'
      operationId: put-portfolio-users
      parameters:
      - name: accountId
        in: path
        description: Account identifier
        required: true
        schema:
          type: string
        example: 6ad04dc2-0db7-4f96-a10d-5a6aff002d05
      - name: id
        in: path
        description: User identifier
        required: true
        schema:
          type: string
        example: c26ad04d-0db7-4f96-a10d-d055a6aff002
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioUser'
      responses:
        '200':
          description: Portfolio user was updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioUser'
        '201':
          description: Portfolio user was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioUser'
        '400':
          description: Bad request. See error code and description for more info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
              examples:
                Job with specified id could not be found:
                  value:
                    code: JOB_NOT_FOUND
                    description: Job with specified id could not be found
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
        '404':
          description: Portfolio account was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
              examples:
                Job with specified id could not be found:
                  value:
                    code: JOB_NOT_FOUND
                    description: Job with specified id could not be found
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
    delete:
      tags:
      - Portfolio Users
      summary: Delete user on portfolio account
      operationId: delete-portfolio-users
      parameters:
      - name: accountId
        in: path
        description: Account identifier
        required: true
        schema:
          type: string
        example: 6ad04dc2-0db7-4f96-a10d-5a6aff002d05
      - name: id
        in: path
        description: User identifier
        required: true
        schema:
          type: string
        example: c26ad04d-0db7-4f96-a10d-d055a6aff002
      responses:
        '204':
          description: Portfolio user was deleted
        '400':
          description: Bad request. See error code and description for more info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
              examples:
                Job with specified id could not be found:
                  value:
                    code: JOB_NOT_FOUND
                    description: Job with specified id could not be found
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
        '404':
          description: Portfolio user was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
              examples:
                Job with specified id could not be found:
                  value:
                    code: JOB_NOT_FOUND
                    description: Job with specified id could not be found
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
    get:
      tags:
      - Portfolio Users
      summary: Get user on portfolio account
      operationId: get-portfolio-users
      parameters:
      - name: accountId
        in: path
        description: Account identifier
        required: true
        schema:
          type: string
        example: 6ad04dc2-0db7-4f96-a10d-5a6aff002d05
      - name: id
        in: path
        description: User identifier
        required: true
        schema:
          type: string
        example: c26ad04d-0db7-4f96-a10d-d055a6aff002
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioUser'
        '400':
          description: Bad request. See error code and description for more info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
              examples:
                Job with specified id could not be found:
                  value:
                    code: JOB_NOT_FOUND
                    description: Job with specified id could not be found
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
        '404':
          description: Portfolio user was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
              examples:
                Job with specified id could not be found:
                  value:
                    code: JOB_NOT_FOUND
                    description: Job with specified id could not be found
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
  /portfolio/accounts/{accountId}/users:
    get:
      tags:
      - Portfolio Users
      summary: Get all user on porfolio account
      operationId: get-portfolio-users-list
      parameters:
      - name: accountId
        in: path
        description: Account identifier
        required: true
        schema:
          type: string
        example: 6ad04dc2-0db7-4f96-a10d-5a6aff002d05
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortfolioUser'
        '400':
          description: Bad request. See error code and description for more info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
              examples:
                Job with specified id could not be found:
                  value:
                    code: JOB_NOT_FOUND
                    description: Job with specified id could not be found
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
        '404':
          description: Portfolio account was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
              examples:
                Job with specified id could not be found:
                  value:
                    code: JOB_NOT_FOUND
                    description: Job with specified id could not be found
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
components:
  schemas:
    ErrorDetails:
      required:
      - code
      - description
      type: object
      properties:
        code:
          minLength: 1
          type: string
        description:
          minLength: 1
          type: string
        request_id:
          type:
          - string
          - 'null'
    PortfolioUser:
      required:
      - name
      - role
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        name:
          minLength: 1
          type: string
        role:
          $ref: '#/components/schemas/PortfolioUserRole'
        created_at_utc:
          type: string
        last_logon_utc:
          type:
          - string
          - 'null'
        magic_link_emails:
          type:
          - array
          - 'null'
          items:
            type: string
    PortfolioUserRole:
      enum:
      - user
      - admin
      - owner
      type: string
