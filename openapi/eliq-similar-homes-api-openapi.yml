openapi: 3.2.0
info:
  title: Insights Similar Homes API
  version: 3.4.1
  contact:
    name: Insights Team
    email: support_b2b@eliq.com
  description: '# API Reference


    The Eliq insights API is organized around REST.'
servers:
- url: http://localhost:3000
security:
- BearerAuth: []
tags:
- name: Similar Homes
paths:
  /v3/locations/{locationId}/similarhomes:
    get:
      tags:
      - Similar Homes
      summary: Get similar homes group
      description: 'Get information of which homes the location is compared to.


        Note that heating_degree_days are only available for countries where the climate zones differ so much that it has a substantial impact on the heating consumption and therefore impacts the comparison. It''s currently supported for France, Finland, Norway, Sweden and the U.K.


        Possible result status action codes:

        | *code* | *description* |

        | --- | --- |

        | sh_home_profile_insufficent | The home profile for the location is insufficient. Please ask a user to provide additional home profile details. |

        | sh_no_matching_group | No group could be found for the location. |'
      operationId: get-v3-locations-locationId-similarhomes
      parameters:
      - name: locationId
        in: path
        description: Location id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimilarHomesGroupResultModel'
              examples:
                Similar homes group:
                  value:
                    result:
                      filters:
                      - key: house_type
                        description: House
                        type: limit_values
                        limit_values:
                        - house
                      - key: heating_type_primary
                        description: Air air pump
                        type: limit_values
                        limit_values:
                        - air_air_pump
                      - key: living_area
                        description: '{LimitMin}-{LimitMax}m²'
                        type: limit_range
                        limit_range:
                          min: 120
                          max: 200
                      - key: heating_degree_days
                        description: Warmer climate
                        type: limit_range
                        limit_range:
                          min: 0
                          max: 3000
                      - key: electric_cars
                        description: Single electric car
                        type: limit_range
                        limit_range:
                          min: 1
                          max: 1
                      contributors: 492
                    result_status:
                      code: ok
                Home profile insufficient:
                  value:
                    result_status:
                      code: not_ok
                      action:
                        code: sh_home_profile_insufficent
                        description: Please update your home profile to get a result
                No matching group:
                  value:
                    result_status:
                      code: not_ok
                      action:
                        code: sh_no_matching_group
                        description: Could not find any group matching your home profile, please check that your home profile is correctly specified.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Location not found:
                  value:
                    type: client_error
                    category: entity_not_found
                    code: ENTITY_NOT_FOUND
                    transaction_id: 0HN18NIB8K5RV:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: Could not find the location.
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Internal Error:
                  value:
                    type: internal_error
                    category: internal_error
                    code: INTERNAL_ERROR
                    transaction_id: 0HN18NIB8K5RV:00000001
                    message: Something went wrong. Please try again later. If problem remains, please contact support.
                    description: Internal server error, please try again later. If problem remains, please contact support.
  /v3/locations/{locationId}/similarhomes/consumption:
    get:
      tags:
      - Similar Homes
      summary: Get similar homes consumption
      description: 'This endpoint returns an array of average energy consumption values for a similar homes group.


        Maximum requested time span by resolution:

        * day: 31 days

        * month: 12 months


        For cost to be available as a unit type, the location must have device price formulas set in our system.


        To date is exclusive and not included in the data range, as is with all endpoints having date range parameters. It is rounded down to the closest start of the period for the given resolution.


        Possible result status action codes:

        | *code* | *description* |

        | --- | --- |

        | sh_home_profile_insufficent | The home profile for the location is insufficient. Please ask a user to provide additional home profile details. |

        | sh_not_enough_contributers | There is not enough energy consumption data for the homes in the similar homes group. This can happen if the period requested is in the future, or if we still have not received consumption data for the requested period. |

        | sh_no_matching_group | No group could be found for the location. |

        | sh_no_price_information | Locations device price formulas are missing. Documentation on price formulas can be found in the Data Management API. |'
      operationId: get-v3-locations-locationId-similarhomes-consumption
      parameters:
      - name: locationId
        in: path
        description: Location id
        required: true
        schema:
          type: integer
          format: int32
      - name: resolution
        in: query
        description: 'Resolution. Valid values: ''day'', ''month''.'
        required: true
        schema:
          type: string
      - name: from
        in: query
        description: From date
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: To date, exclusive
        required: true
        schema:
          type: string
          format: date-time
      - name: fuel
        in: query
        description: 'Fuel. Valid values: ''elec'', ''gas''.'
        schema:
          type: string
          default: elec
      - name: unit
        in: query
        description: 'Unit. Valid values: ''cost'', ''energy''.'
        schema:
          type: string
          default: energy
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimilarHomesConsumptionResultModel'
              examples:
                Similar homes monthly data:
                  value:
                    result:
                      values:
                      - 446.37
                      - 445.21
                      resolution: month
                      fuel: elec
                      unit: energy
                      from: '2023-01-01T00:00:00'
                      to: '2023-03-01T00:00:00'
                    result_status:
                      code: ok
                Home profile insufficient:
                  value:
                    result_status:
                      code: not_ok
                      action:
                        code: sh_home_profile_insufficent
                        description: Please update your home profile to get a result
                Not enough contributors:
                  value:
                    result_status:
                      code: not_ok
                      action:
                        code: sh_not_enough_contributers
                        description: Not enough similar homes data for the specified time period. Please try again in a few days
                No matching group:
                  value:
                    result_status:
                      code: not_ok
                      action:
                        code: sh_no_matching_group
                        description: Could not find any group matching your home profile, please check that your home profile is correctly specified.
                No price information:
                  value:
                    result_status:
                      code: not_ok
                      action:
                        code: sh_no_price_information
                        description: No price information could be found for the location in the given timespan
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid parameter:
                  value:
                    type: client_error
                    category: invalid_parameter
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: Invalid parameter details
                From parameter missing:
                  value:
                    type: client_error
                    category: invalid_parameter
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: Parameter 'from' missing
                To parameter missing:
                  value:
                    type: client_error
                    category: invalid_parameter
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: Parameter 'to' missing
                Date range invalid:
                  value:
                    type: client_error
                    category: invalid_parameter
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: Parameter 'from' cannot be larger than 'to'
                From parameter timezone unsupported:
                  value:
                    type: client_error
                    category: invalid_parameter
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: Parameter 'from' should not include a timezone offset
                To parameter timezone unsupported:
                  value:
                    type: client_error
                    category: invalid_parameter
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: Parameter 'to' should not include a timezone offset
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Location not found:
                  value:
                    type: client_error
                    category: entity_not_found
                    code: ENTITY_NOT_FOUND
                    transaction_id: 0HN18NIB8K5RV:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: Could not find the location.
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Internal Error:
                  value:
                    type: internal_error
                    category: internal_error
                    code: INTERNAL_ERROR
                    transaction_id: 0HN18NIB8K5RV:00000001
                    message: Something went wrong. Please try again later. If problem remains, please contact support.
                    description: Internal server error, please try again later. If problem remains, please contact support.
  /v3/locations/{locationId}/similarhomes/report:
