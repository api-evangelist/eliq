      tags:
      - Similar Homes
      summary: Get similar homes report
      description: 'Get energy consumption data for similar homes. Contains an average value and deciles, from 1st to 10th (maximum value), for the group.


        Maximum requested time span by resolution:

        * day: 31 days

        * month: 12 months


        For cost to be available as a unit type, the location must have device price formulas set in our system.


        To date is exclusive and not included in the data range, as is with all endpoints having date range parameters. It is rounded down to the closest start of the period for the given resolution.


        Possible result status action codes:

        | *code* | *description* |

        | --- | --- |

        | sh_home_profile_insufficent | The home profile for the location is insufficient. Please ask a user to provide additional home profile details. |

        | sh_not_enough_contributers | There is not enough energy consumption data for the homes in the similar homes group. This can happen if the period requested is in the future, or if we still have not received consumption data for the requested period. |

        | sh_no_matching_group | No group could be found for the location. |

        | sh_no_price_information | Locations device price formulas are missing. Documentation on price formulas can be found in the Data Management API. |'
      operationId: get-v3-locations-locationId-similarhomes-report
