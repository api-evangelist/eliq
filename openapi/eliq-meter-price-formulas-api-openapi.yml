components:
  schemas:
    Block:
      type: object
      properties:
        resolution:
          type:
          - string
          - 'null'
        register_id:
          type:
          - string
          - 'null'
        unit_rate:
          type: number
          format: double
        from_kwh:
          type:
          - integer
          - 'null'
          format: int64
        to_kwh:
          type:
          - integer
          - 'null'
          format: int64
        from_m3:
          type:
          - integer
          - 'null'
          format: int64
        to_m3:
          type:
          - integer
          - 'null'
          format: int64
    Charge:
      type: object
      properties:
        resolution:
          type:
          - string
          - 'null'
        charge:
          type:
          - number
          - 'null'
          format: double
        type:
          type:
          - string
          - 'null'
        capacity_tariff:
          $ref: '#/components/schemas/CapacityTariff'
    CapacityTariff:
      type: object
      properties:
        charge_tariff:
          type: number
          format: double
        minimum_contribution:
          type: number
          format: double
        calculation_type:
          type:
          - string
          - 'null'
    Element:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        charge:
          $ref: '#/components/schemas/Charge'
        unit_rate:
          $ref: '#/components/schemas/UnitRate'
    Fixed:
      type: object
      properties:
        unit_rate:
          type:
          - number
          - 'null'
          format: double
    PriceFormula:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        from:
          type:
          - string
          - 'null'
        to:
          type:
          - string
          - 'null'
        currency_code:
          type:
          - string
          - 'null'
        elements:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Element'
        price_multiplier:
          type:
          - number
          - 'null'
          format: double
        energy_unit:
          type:
          - string
          - 'null'
    Tou:
      type: object
      properties:
        register_id:
          type:
          - string
          - 'null'
        unit_rate:
          type:
          - number
          - 'null'
          format: double
        intervals:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Interval'
        skip_intervals:
          type:
          - boolean
          - 'null'
    ErrorDetails:
      required:
      - code
      - description
      type: object
      properties:
        code:
          minLength: 1
          type: string
        description:
          minLength: 1
          type: string
        request_id:
          type:
          - string
          - 'null'
    NoContentResult:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
    UnitRate:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        fixed:
          $ref: '#/components/schemas/Fixed'
        tou:
          $ref: '#/components/schemas/Tou'
        block:
          $ref: '#/components/schemas/Block'
        spot_price:
          $ref: '#/components/schemas/SpotPrice'
        weekdays:
          type:
          - array
          - 'null'
          items:
            type: string
    Interval:
      type: object
