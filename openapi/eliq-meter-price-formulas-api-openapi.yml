  /meters/{meterId}/priceformulas/{fromDate}:
    delete:
      tags:
      - Meter Price Formulas
      summary: Delete a price formulas for a meter by meter external reference and older than…
      operationId: delete-meter-from-date-price-formulas
      parameters:
      - name: meterId
        in: path
        description: External meter id
        required: true
        schema:
          type: string
        example: abc123
      - name: fromDate
        in: path
        description: Starting date from when price formulas should be deleted
        required: true
        schema:
          type: string
        example: '2022-01-01'
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoContentResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
              examples:
                Meter with the given 'meter_id' could not be found. Meter was either deleted or not imported.:
                  value:
                    code: PRICE_FORMULA_METER_NOT_FOUND
                    description: Meter with the given 'meter_id' could not be found. Meter was either deleted or not imported.
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Parameter 'id' must not be null or empty:
                  value:
                    code: METER_ID_MISSING
                    description: Parameter 'id' must not be null or empty
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
              examples:
                Price formula for the given 'meter_id' and 'from' date was not found.:
                  value:
                    code: PRICE_FORMULA_NOT_FOUND
                    description: Price formula for the given 'meter_id' and 'from' date was not found.
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Location with given id could not be found:
                  value:
                    code: LOCATION_NOT_FOUND
                    description: Location with given id could not be found
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Meter with given id could not be found:
                  value:
                    code: METER_NOT_FOUND
                    description: Meter with given id could not be found
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
              examples:
                Internal server error. If problem remains, please contact support:
                  value:
                    code: INTERNAL_ERROR
                    description: Internal server error. If problem remains, please contact support
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
