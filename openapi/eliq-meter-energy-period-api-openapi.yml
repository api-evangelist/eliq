components:
  schemas:
    ErrorDetails:
      required:
      - code
      - description
      type: object
      properties:
        code:
          minLength: 1
          type: string
        description:
          minLength: 1
          type: string
        request_id:
          type:
          - string
          - 'null'
    Register:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        energy_wh:
          type:
          - number
          - 'null'
          format: float
        energy_m3:
          type:
          - number
          - 'null'
          format: float
    EnergyMonthlyData:
      type: object
      properties:
        client_id:
          type: integer
          format: int64
        device_ref:
          type:
          - string
          - 'null'
        from:
          type:
          - string
          - 'null'
        to:
          type:
          - string
          - 'null'
        energy_wh:
          type:
          - number
          - 'null'
          format: float
        energy_m3:
          type:
          - number
          - 'null'
          format: float
        is_estimated:
          type: boolean
        registers:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Register'
    NoContentResult:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
