          type: string
      - name: From
        in: query
        schema:
          type: string
      - name: ToDate
        in: query
        schema:
          type: string
      - name: To
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnergyMonthlyData'
              examples:
                Energy periodic data:
                  value:
                  - client_id: 0
                    from: '2024-01-01'
                    to: '2024-02-01'
                    energy_wh: 35000.0
                    is_estimated: false
                    registers:
                    - id: '123'
                      energy_wh: 10000.0
                    - id: '456'
                      energy_wh: 25000.0
                  - client_id: 0
                    from: '2024-02-01'
                    to: '2024-03-01'
                    energy_wh: 20000.0
                    is_estimated: false
                    registers:
                    - id: '123'
                      energy_wh: 10000.0
                    - id: '456'
                      energy_wh: 10000.0
                  - client_id: 0
                    from: '2024-03-01'
                    to: '2024-04-01'
                    energy_wh: 80000.0
                    is_estimated: false
                    registers:
                    - id: '123'
                      energy_wh: 10000.0
                    - id: '456'
                      energy_wh: 70000.0
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
              examples:
                Missing parameters 'from' and 'to'. This may be caused by incorrect date format, please refer to documentation:
                  value:
                    code: DATE_RANGE_MISSING
                    description: Missing parameters 'from' and 'to'. This may be caused by incorrect date format, please refer to documentation
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Parameter 'id' must not be null or empty:
                  value:
                    code: METER_ID_MISSING
                    description: Parameter 'id' must not be null or empty
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                From date is missing. This may be caused by incorrect date format, please refer to documentation:
                  value:
                    code: FROM_MISSING
                    description: From date is missing. This may be caused by incorrect date format, please refer to documentation
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                To date is missing. This may be caused by incorrect date format, please refer to documentation:
                  value:
                    code: TO_MISSING
                    description: To date is missing. This may be caused by incorrect date format, please refer to documentation
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Date range is invalid i.e. 'from' date is after 'to' date:
                  value:
                    code: DATE_RANGE_INVALID
                    description: Date range is invalid i.e. 'from' date is after 'to' date
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Maximum range between 'from' and 'to' exceeded. Please refer to documentation:
                  value:
                    code: DATE_RANGE_LIMIT_EXCEEDED
                    description: Maximum range between 'from' and 'to' exceeded. Please refer to documentation
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
              examples:
                Meter with given id could not be found:
                  value:
                    code: METER_NOT_FOUND
                    description: Meter with given id could not be found
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
              examples:
                Internal server error. If problem remains, please contact support:
                  value:
                    code: INTERNAL_ERROR
                    description: Internal server error. If problem remains, please contact support
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
    delete:
      tags:
      - Meter Energy Period
      summary: Deletes the stored periodic (monthly or higher) energy data for a meter within…
      operationId: delete-period-energy-data-meterid
      parameters:
      - name: id
        in: path
        description: Meter external reference
        required: true
        schema:
          type: string
      - name: FromDate
