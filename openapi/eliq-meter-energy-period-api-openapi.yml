openapi: 3.2.0
info:
  title: Eliq Data Management Meter Energy Period API
  description: '# API Reference


    The Eliq data management API is organized around REST. The API accepts JSON-encoded request bodies, returns JSON-encoded responses and uses standard HTTP response codes. The URLs are all resource oriented around Eliq''s three main entities; User, Location and Meter


    # Errors


    Eliq Integration API uses standard HTTP response codes to indicate success or failure of a request. Codes with 2xx indicate success, 4xx indicate error due to invalid input, and 5xx indicates an error in Eliq Integration API.


    ## Status codes


    *Status code* | *Description*

    --- | ---

    200 - OK | Everything worked as expected.

    201 - Created | Resource created.

    202 - Accepted | Successful request, and will be handled later. A reference id will be available in the response body.

    204 - No Content | Successful request. Used in successful delete requests

    400 - Bad Request | Request input data is invalid.

    401 - Unauthorized | Access token invalid for the given request. Eg. access token expired.

    404 - Not Found | Requested resource not found

    500, 502, 503, 504 | Something wrong with Eliq Integration API


    ## Error body


    Eliq Integration API returns an error response body on failures to provide additional information on the error. Please find the error body and description below.


    ```json

    {

    "code":"",

    "description":"",

    "request_id":"16a3ae43-ca5f-455e-9aef-f93679bedc8d"

    }

    ```


    *Field* | *Type* | *Description*

    --- | --- | ---

    code | String | Error code. Possible error codes per request can be found in each request section. Error codes do not change, and can be used to tie actions to.

    description | String | A description of the error for developers

    request_id | String | Identifier of the request. Passed when in contact with support


    ## Request ID


    Each API request has an associated request id. You can find this value in the response headers, under X-Request-Id. The request id can be used in communication with Eliq support.'
  contact:
    name: Support
    email: support_b2b@eliq.com
  version: 1.5.2
tags:
- name: Meter Energy Period
paths:
  /meters/{id}/energy/period:
    post:
      tags:
      - Meter Energy Period
      summary: Creates or updates periodic (monthly or higher) energy data for a meter
      operationId: post-period-energy-data-meterid
      parameters:
      - name: id
        in: path
        description: Meter external reference
        required: true
        schema:
          type: string
      requestBody:
        description: Periodic energy data object
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/EnergyMonthlyData'
            examples:
              Energy periodic data:
                value:
                - client_id: 0
                  from: '2024-01-01'
                  to: '2024-02-01'
                  energy_wh: 35000.0
                  is_estimated: false
                  registers:
                  - id: '123'
                    energy_wh: 10000.0
                  - id: '456'
                    energy_wh: 25000.0
                - client_id: 0
                  from: '2024-02-01'
                  to: '2024-03-01'
                  energy_wh: 20000.0
                  is_estimated: false
                  registers:
                  - id: '123'
                    energy_wh: 10000.0
                  - id: '456'
                    energy_wh: 10000.0
                - client_id: 0
                  from: '2024-03-01'
                  to: '2024-04-01'
                  energy_wh: 80000.0
                  is_estimated: false
                  registers:
                  - id: '123'
                    energy_wh: 10000.0
                  - id: '456'
                    energy_wh: 70000.0
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoContentResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
              examples:
                Request input is missing. This may be caused by incorrect format of input.:
                  value:
                    code: INPUT_MISSING
                    description: Request input is missing. This may be caused by incorrect format of input.
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Parameter 'id' must not be null or empty:
                  value:
                    code: METER_ID_MISSING
                    description: Parameter 'id' must not be null or empty
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Request body 'energyMonthlyData' must not be null or empty:
                  value:
                    code: ENERGY_MONTHLY_DATA_MUST_NOT_BE_NULL
                    description: Request body 'energyMonthlyData' must not be null or empty
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Sequence contains duplicate date ranges:
                  value:
                    code: SEQUENCE_MUST_NOT_CONTAIN_DUPLICATE_DATES
                    description: Sequence contains duplicate date ranges
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Either 'energy_wh' or 'energy_m3' must be provided:
                  value:
                    code: ENERGY_WH_OR_ENERGY_M3_MUST_NOT_BE_NULL
                    description: Either 'energy_wh' or 'energy_m3' must be provided
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                '''energy_wh'' and ''energy_m3'' cannot be provided together':
                  value:
                    code: ENERGY_WH_AND_ENERGY_M3_MUST_NOT_BE_PROVIDED_TOGETHER
                    description: '''energy_wh'' and ''energy_m3'' cannot be provided together'
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                '''energy_m3'' cannot be used on a meter whose fuel type does not support it':
                  value:
                    code: ENERGY_M3_MUST_NOT_BE_ADDED_ON_UNSUPPORTED_FUEL_METER
                    description: '''energy_m3'' cannot be used on a meter whose fuel type does not support it'
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Parameter 'from' is missing or invalid:
                  value:
                    code: FROM_MISSING
                    description: Parameter 'from' is missing or invalid
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Parameter 'to' is missing or invalid:
                  value:
                    code: TO_MISSING
                    description: Parameter 'to' is missing or invalid
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Parameter 'registers[].energy_wh' must not be null:
                  value:
                    code: REGISTERS_ENERGY_MUST_NOT_BE_NULL
                    description: Parameter 'registers[].energy_wh' must not be null
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Parameter 'registers[].id' must not be null or empty:
                  value:
                    code: REGISTERS_ID_CANNOT_BE_NULL
                    description: Parameter 'registers[].id' must not be null or empty
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Registers contain duplicate 'id' values:
                  value:
                    code: REGISTERS_CANNOT_HAVE_SAME_ID
                    description: Registers contain duplicate 'id' values
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
              examples:
                Meter with given id could not be found:
                  value:
                    code: METER_NOT_FOUND
                    description: Meter with given id could not be found
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
              examples:
                Internal server error. If problem remains, please contact support:
                  value:
                    code: INTERNAL_ERROR
                    description: Internal server error. If problem remains, please contact support
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
    get:
      tags:
      - Meter Energy Period
      summary: Gets the stored periodic (monthly or higher) energy data for a meter within a…
