      operationId: get-v3-locations-locationId-export
      description: 'Get exported energy for the location. Whether location export data exists, and between which dates, can be found in the meta data in /locations/{locationId} endpoint. This represents the energy exported to the grid.


        Maximum time spans for resolutions


        * 6min: 7 days

        * 15min: 7 days

