openapi: 3.2.0
info:
  title: Insights Energy Data API
  version: 3.4.1
  contact:
    name: Insights Team
    email: support_b2b@eliq.com
  description: '# API Reference


    The Eliq insights API is organized around REST.'
servers:
- url: http://localhost:3000
security:
- BearerAuth: []
tags:
- name: Energy Data
paths:
  /v3/locations/{locationId}/consumption:
    get:
      tags:
      - Energy Data
      summary: Get Location consumption
      description: 'Get energy consumption for the location. Whether location consumption data exists, and between which dates, can be found in the meta data in /locations/{locationId} endpoint.


        Maximum time spans for resolutions:

        * 6min: 7 days

        * 15min: 7 days

        * 30min: 7 days

        * hour: 93 days

        * day: 5 years

        * month: 5 years


        NOTE! For cost to be available as a unit type, the location prices must be set in our database. If no location prices are available there will be an error response.


        NOTE! Unit of m3 is only available with fuel of gas. Conversion between m3 and Wh values relies on a calorific rate being configured for a client. Please contact Eliq for more details about having this configuration in place.'
      operationId: get-v3-locations-locationId-consumption
      parameters:
      - name: locationId
        in: path
        description: Location identifier
        required: true
        schema:
          type: integer
          format: int32
      - name: from
        in: query
        description: From date
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: To date, exclusive
        schema:
          type: string
          format: date-time
      - name: resolution
        in: query
        description: 'Data granularity resolution. Valid values: ''6min'', ''15min'', ''30min'', ''hour'', ''day'', ''month''.'
        schema:
          type: string
      - name: cost_type
        in: query
        description: "Only applicable when 'cost' unit is passed. Specifies the consumption cost type to return.\n             If set to 'price_formula', price formulas are used to calculate the consumption costs.\n             If set to 'average_cost', the costs are calculated based on the average electricity price for the provided period."
        schema:
          type: string
          default: price_formula
      - name: fuel
        in: query
        description: 'Fuel. Valid values: ''elec'', ''gas''.'
        schema:
          type: string
          default: elec
      - name: unit
        in: query
        description: 'Unit. Valid values: ''cost'', ''energy''.'
        schema:
          type: string
          default: energy
      - name: include_incomplete
        in: query
        description: Includes periods with incomplete data if set to true.
        schema:
          type: boolean
          default: true
      - name: include_co2
        in: query
        description: Includes co2 emissions data if set to true.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSeriesData'
              examples:
                Monthly energy response:
                  value:
                    consumption:
                    - 446.37
                    - null
                    resolution: month
                    fuel: elec
                    unit: energy
                    from: '2021-01-01T00:00:00'
                    to: '2021-03-01T00:00:00'
                Monthly cost response:
                  value:
                    consumption:
                    - 33.29
                    - null
                    resolution: month
                    fuel: elec
                    unit: cost
                    from: '2021-01-01T00:00:00'
                    to: '2021-03-01T00:00:00'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid parameter unit:
                  value:
                    type: client_error
                    category: invalid_parameter
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: 'Invalid parameter ''unit'': The value <argument> is not valid.'
                Invalid parameter resolution:
                  value:
                    type: client_error
                    category: invalid_parameter
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: 'Invalid parameter ''resolution'': The value <argument> is not valid.'
                Invalid parameter cost_type:
                  value:
                    type: client_error
                    category: invalid_parameter
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: 'Invalid parameter ''cost_type'': The value <argument> is not valid.'
                Invalid parameter fuel:
                  value:
                    type: client_error
                    category: invalid_parameter
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: 'Invalid parameter ''fuel'': The value <argument> is not valid.'
                From parameter missing:
                  value:
                    type: client_error
                    category: invalid_parameter
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: Parameter 'from' missing
                To parameter missing:
                  value:
                    type: client_error
                    category: invalid_parameter
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: Parameter 'to' missing
                Date range invalid:
                  value:
                    type: client_error
                    category: invalid_parameter
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: Parameter 'from' cannot be larger than 'to'
                From parameter timezone unsupported:
                  value:
                    type: client_error
                    category: invalid_parameter
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: Parameter 'from' should not include a timezone offset
                To parameter timezone unsupported:
                  value:
                    type: client_error
                    category: invalid_parameter
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: Parameter 'to' should not include a timezone offset
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Location not found:
                  value:
                    type: client_error
                    category: entity_not_found
                    code: ENTITY_NOT_FOUND
                    transaction_id: 0HN18NIB8K5RV:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: Could not find the location.
                Unit conversion rate not found:
                  value:
                    type: client_error
                    category: client_conversion_rate_not_found
                    code: CLIENT_CONVERSION_RATE_NOT_FOUND
                    transaction_id: 0HN18NIB8K5RV:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: Conversion rate is missing for the client
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Internal Error:
                  value:
                    type: internal_error
                    category: internal_error
                    code: INTERNAL_ERROR
                    transaction_id: 0HN18NIB8K5RV:00000001
                    message: Something went wrong. Please try again later. If problem remains, please contact support.
                    description: Internal server error, please try again later. If problem remains, please contact support.
  /v3/locations/{locationId}/peakpower/{resolution}:
    get:
      tags:
      - Energy Data
      summary: Get location peak power
      description: 'Get energy peak power for the location. Whether location peak power data exists, and between which dates, can be found in the meta data in /locations/{locationId} endpoint.


        Maximum time spans for resolutions:

        * hour: 5 years

        * day: 5 years

        * month: 5 years


        Import, export, consumption and production response properties are deprecated, please use the *power* property.'
      operationId: get-v3-locations-locationId-peakpower
      parameters:
      - name: locationId
        in: path
        description: Location id
        required: true
        schema:
          type: integer
          format: int32
      - name: resolution
        in: path
        description: Data resolution
        required: true
        schema:
          type: string
      - name: peak_power_resolution
        in: query
        description: Resolution of peak power values
        required: true
        schema:
          type: string
      - name: from
        in: query
        description: From date
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: To date, exclusive
        required: true
        schema:
          type: string
          format: date-time
      - name: fuel
        in: query
        description: Fuel type
        schema:
          enum:
          - elec
          - gas
          - district_heating
          type: string
          description: Fuel type
          default: elec
      - name: direction
        in: query
        description: Type of meter
        schema:
          enum:
          - import
          - export
          - consumption
          - production
          type: string
          description: Direction type
          default: consumption
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeakPowerResponse'
              examples:
                Import peak power:
                  value:
                    power:
                    - 3617.840087890625
                    peak_power_timestamp:
                    - '2024-06-01T14:00:00'
                    from: '2024-06-01T00:00:00'
                    to: '2024-07-01T00:00:00'
                    fuel: elec
                    direction: import
                    resolution: month
                    peak_power_resolution: hour
                    import:
                    - 3617.840087890625
                Consumption peak power:
                  value:
                    power:
                    - 1228.7999420166016
                    - 436.4199981689453
                    - 1418.760009765625
                    - 746.5799865722656
                    peak_power_timestamp:
                    - '2024-07-01T06:30:00'
                    - '2024-07-02T08:30:00'
                    - '2024-07-03T14:00:00'
                    - '2024-07-04T16:00:00'
                    from: '2024-07-01T00:00:00'
                    to: '2024-07-05T00:00:00'
                    fuel: elec
                    direction: consumption
                    resolution: day
                    peak_power_resolution: 30min
                    consumption:
                    - 1228.7999420166016
                    - 436.4199981689453
                    - 1418.760009765625
                    - 746.5799865722656
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                From parameter missing:
                  value:
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    description: Parameter 'from' missing
                To parameter missing:
                  value:
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    description: Parameter 'to' missing
                Date range invalid:
                  value:
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    description: Parameter 'from' cannot be larger than 'to'
                From parameter timezone unsupported:
                  value:
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    description: Parameter 'from' should not include a timezone offset
                To parameter timezone unsupported:
                  value:
                    code: INVALID_PARAMETER
                    transaction_id: 0HN1O72JU5P3C:00000001
                    description: Parameter 'to' should not include a timezone offset
                Invalid peak power resolution:
                  value:
                    code: INVALID_PEAK_POWER_RESOLUTION
                    transaction_id: 0HN18NIB8K5RV:00000001
                    description: Invalid peak power resolution type. Only valid values are e.g 6min, 15min, 30min and hour.
                Period too long:
                  value:
                    code: PERIOD_TOO_LONG
                    transaction_id: 0HN18NIB8K5RV:00000001
                    description: Maximum period requested can not exceed 5 years.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Location not found:
                  value:
                    code: ENTITY_NOT_FOUND
                    transaction_id: 0HN18NIB8K5RV:00000001
                    description: Could not find the location.
  /v3/locations/{locationId}/production:
    parameters:
    - schema:
        type: string
      name: locationId
      in: path
      required: true
      description: Location identifier
    get:
      summary: Get location production
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeseriesData'
              examples:
                Example month:
                  value:
                    production:
                    - 446.37
                    - null
                    fuel: elec
                    unit: energy
                    resolution: month
                    from: '2021-01-01T00:00:00'
                    to: '2021-03-01T00:00:00'
        '400':
          description: 'Bad Request


            Possible errors


            | *type* | *category* | *description* |

            | --- | --- | --- |

            | client_error | invalid_parameter | Timespan between ''from'' and ''to'' to large, max {maxTimeSpan} days for the given resolution |

            | client_error | invalid_parameter | Parameter ''to'' missing |

            | client_error | invalid_parameter | Parameter ''from'' missing |

            | client_error | invalid_parameter | Parameter ''from'' cannot be larger than ''to'' |

            | client_error | invalid_parameter | Invalid parameter ''unit''. Should be one of: energy, cost |

            | client_error | invalid_parameter | Invalid parameter ''fuel''. Should be one of: elec, gas, district_heating |

            | client_error | invalid_parameter | Invalid parameter ''resolution''. Should be one of: 6min, 15min, 30min, hour, day, month |'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Error example:
                  value:
                    type: client_error
                    category: invalid_parameter
                    code: INVALID_PARAMETER
                    description: Invalid parameter 'to'. Cannot be null
                    message: 'Something went wrong, please try again later. If problem remains, please contact support (error: 1ad3a534117d4).'
                    transaction_id: 37c4ef86-d525-42c8-b65f-9b4cfcce0df6
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Location not found:
                  value:
                    type: client_error
                    category: entity_not_found
                    code: ENTITY_NOT_FOUND
                    transaction_id: 0HN18NIB8K5RV:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: Could not find the location.
                Unit conversion rate not found:
                  value:
                    type: client_error
                    category: client_conversion_rate_not_found
                    code: CLIENT_CONVERSION_RATE_NOT_FOUND
                    transaction_id: 0HN18NIB8K5RV:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: Conversion rate is missing for the client
      operationId: get-v3-locations-locationId-production
      description: 'Get energy production for the location. Whether location production data exists, and between which dates, can be found in the meta data in /locations/{locationId} endpoint. The production will be a summary of all production for a location, meaning that in case of multiple pv systems installed, this will return the total energy.


        Maximum time spans for resolutions


        * 6min: 7 days

        * 15min: 7 days

        * 30min: 7 days

        * hour: 93 days

        * day: 5 years

        * month: 5 years


        `NOTE!` For cost to be available as a unit type, the location prices must be set in our database. If no location prices are available there will be an error response.'
      parameters:
      - schema:
          type: string
          enum:
          - elec
          - gas
          - district_heating
          default: elec
          example: elec
        in: query
        name: fuel
        description: Fuel. Defaults to 'elec'
      - schema:
          type: string
          default: energy
          enum:
          - energy
          - cost
          example: energy
        in: query
        name: unit
        description: Unit. Defaults to 'energy'
      - schema:
          type: string
          enum:
          - 6min
          - 15min
          - 30min
          - hour
          - day
          - month
          example: day
        in: query
        name: resolution
        description: Resolution of data
        required: true
      - schema:
          type: string
          example: '2021-01-01T00:00:00'
          format: date-time
        in: query
        name: from
        description: From date
        required: true
      - schema:
          type: string
          format: date-time
          example: '2021-02-01T00:00:00'
        in: query
        name: to
        description: The 'to date' represents the end date of the time period. The value is exclusive, indicating that the specified date is not included in the data range. It is rounded down to the closest start of the period for the given resolution.
        required: true
      tags:
      - Energy Data
