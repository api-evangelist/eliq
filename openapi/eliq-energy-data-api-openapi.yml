      - schema:
          type: string
          default: energy
          enum:
          - energy
          - cost
          example: energy
        in: query
        name: unit
        description: Unit. Defaults to 'energy'
      - schema:
          type: string
          enum:
          - 6min
          - 15min
          - 30min
          - hour
          - day
          - month
          example: day
        in: query
        name: resolution
        description: Resolution of data
        required: true
      - schema:
          type: string
          example: '2021-01-01T00:00:00'
          format: date-time
        in: query
