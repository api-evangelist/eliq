                    transaction_id: 0HN18NIB8K5RV:00000001
                    message: Something went wrong, please try again later. If problem remains, please contact support.
                    description: Conversion rate is missing for the client
      operationId: get-v3-locations-locationId-import
      description: 'Get imported energy for the location. Whether location import data exists, and between which dates, can be found in the meta data in /locations/{locationId} endpoint. This represents the energy imported from the grid.


        Maximum time spans for resolutions


