components:
  schemas:
    TimeseriesData:
      description: Model containing time series data. Different parameters will be available depending on the data requested, see below for more information
      type: object
      x-examples:
        example-1:
          consumption:
          - 446.37
          - null
          import:
          - 446.37
          - null
          export:
          - 446.37
          - null
          production:
          - 446.37
          - null
          fuel: elec
          unit: energy
          resolution: month
          from: '2019-01-01T00:00:00'
          to: '2019-03-01T00:00:00'
      examples:
      - consumption:
        - 446.37
        - null
        fuel: elec
        unit: energy
        resolution: month
        from: '2021-01-01T00:00:00'
        to: '2021-03-01T00:00:00'
      title: Time series data
      properties:
        consumption:
          type: array
          description: Available if consumption has been queried. Will always contain the exact amount of elements as there are time frames between ‘to’ and ‘from’ with the given ‘resolution’. Values inside the array can be null if no energy data exists (One day always contains 24 values). The consumption values are floating-point numbers.
          items:
            type:
            - number
            - 'null'
        import:
          type: array
          description: Available if import has been queried. Will always contain the exact amount of elements as there are time frames between ‘to’ and ‘from’ with the given ‘resolution’. Values inside the array can be null if no energy data exists (One day always contains 24 values). The import values are floating-point numbers.
          items:
            type:
            - number
            - 'null'
        export:
          type: array
          description: Available if export has been queried. Will always contain the exact amount of elements as there are time frames between ‘to’ and ‘from’ with the given ‘resolution’. Values inside the array can be null if no energy data exists (One day always contains 24 values). The export values are floating-point numbers.
          items:
            type:
            - number
            - 'null'
        production:
          type: array
          description: Available if production has been queried. Will always contain the exact amount of elements as there are time frames between ‘to’ and ‘from’ with the given ‘resolution’. Values inside the array can be null if no energy data exists (One day always contains 24 values). The production values are floating-point numbers.
          items:
            type:
            - number
            - 'null'
        forecast:
          type: array
          description: Available if forecast has been queried. Will always contain the exact amount of elements as there are time frames between ‘to’ and ‘from’ with the given ‘resolution’. Values inside the array can be null if no energy data exists. The forecast values are floating-point numbers.
          items:
            type:
            - number
            - 'null'
        fuel:
          type: string
          minLength: 1
          description: Can be ‘elec’, ‘gas’ or ‘district_heating’. Matches with the value passed in query parameters of the request if provided
          enum:
          - elec
          - gas
          - district_heating
          example: elec
        unit:
          type: string
          minLength: 1
          description: 'Can be ‘cost’, ‘energy’ or ''m3''. Matches with the value passed in query parameters of the request if provided, otherwise default.


            Only return m3 if the unit is available.'
          enum:
          - energy
          - cost
          example: energy
        resolution:
          type: string
          minLength: 1
          description: Can be '6min','15min', '30min', 'hour', 'day' or 'month'. Matches with the value passed in query parameters of the request.
          enum:
          - 6min
          - 15min
          - 30min
          - hour
          - day
          - month
        from:
          type: string
          minLength: 1
          description: From date
          example: '2021-01-01T00:00:00'
        to:
          type: string
          minLength: 1
          description: To date
          example: '2021-02-01T00:00:00'
      required:
      - fuel
      - unit
      - resolution
      - from
      - to
    PeakPowerResponse:
      required:
      - direction
      - from
      - fuel
      - peak_power_resolution
      - peak_power_timestamp
      - power
      - resolution
      - to
      type: object
      properties:
        power:
          type: array
          items:
            type: number
            format: double
          description: List of power values
        peak_power_timestamp:
          type: array
          items:
            type: string
            format: date-time
          description: List of timestamps indicating when the peak power was recorded
        from:
          type: string
          description: From date
          format: date-time
        to:
          type: string
          description: To date, exclusive
          format: date-time
        fuel:
          enum:
          - elec
          - gas
          - district_heating
          type: string
          description: Fuel type
        direction:
          enum:
          - import
          - export
          - consumption
          - production
          type: string
          description: Direction type
        resolution:
          enum:
          - hour
          - day
          - month
          type: string
          description: Peak power data resolution
        peak_power_resolution:
          enum:
          - 6min
          - 10min
          - 15min
          - 30min
          - hour
          type: string
          description: Resolution of peak power values
        consumption:
          type: array
          items:
            type: number
            format: double
          description: List of consumption values
          nullable: true
          deprecated: true
        production:
          type: array
          items:
            type: number
            format: double
          description: List of production values
          nullable: true
          deprecated: true
        import:
          type: array
          items:
            type: number
            format: double
          description: List of import values
          nullable: true
          deprecated: true
        export:
          type: array
          items:
            type: number
            format: double
          description: List of export values
          nullable: true
          deprecated: true
      description: Peak power response model
    UnitType:
