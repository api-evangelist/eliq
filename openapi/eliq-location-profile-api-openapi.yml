  /v3/locations/{locationId}/profile/{profileValueId}:
    patch:
      tags:
      - Location Profile
      summary: Patch location profile's value
      description: 'This endpoint can be used to update a specific location profile''s value.


        We strongly recommend using this endpoint only for correcting mistakes a user has made while entering his location profile and using the POST Add new location profile values endpoint in order to create historic change entries of the location profile.


        For example:

        A user has entered that he has 2 electric boilers at his location when he actually meant 1. This can be corrected using PATCH location profile''s value.

        In the scenario where the user has had a single boiler since 2022-01-01, and decided to purchase a 2nd boiler on 2024-01-01, we recommend using POST Add new location profile values to make use of the historic location profile feature.'
      operationId: patch-v3-location-profile-value
      parameters:
      - name: locationId
        in: path
        description: Location id
        required: true
        schema:
          type: integer
          format: int32
      - name: profileValueId
        in: path
        description: Profile value id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: PATCH request model
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/PatchLocationProfileRequestModel_2'
            examples:
              Payload with string value:
                value:
                  from: '2024-01-01T00:00:00'
                  value: apartment
              Payload with number value:
                value:
                  from: '2024-01-01T00:00:00'
                  value: 4
              Payload with empty value:
                value:
                  from: '2024-01-01T00:00:00'
              Payload with empty from:
                value:
                  value: apartment
              Payload for multi-select properties:
                value:
                  from: '2024-01-01T00:00:00'
