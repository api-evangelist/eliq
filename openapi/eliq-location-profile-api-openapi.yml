        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationProfileValueResponse'
              examples:
                Location profile:
                  value:
                  - id: 00000000-0000-0000-0000-000000000000
                    key: house_type
                    value: apartment
                    from: '2024-09-01T00:00:00'
                  - id: 00000000-0000-0000-0000-000000000000
                    key: living_area
                    value: 450
                    from: '2024-09-01T00:00:00'
        '400':
