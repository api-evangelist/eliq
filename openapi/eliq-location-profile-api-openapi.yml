  /v3/locations/{locationId}/profile/type:
    get:
      tags:
      - Location Profile
      summary: Get location profile type
      description: Get the profile type for the location.
      operationId: get-v3-location-profile-type
      parameters:
      - name: locationId
        in: path
        description: Location id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationProfileType_2'
              examples:
                Residential type:
                  value:
                    type: residential
                Business type:
                  value:
                    type: business
                Type undefined:
                  value:
                    type: undefined
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Location not found:
                  value:
                    code: ENTITY_NOT_FOUND
                    transaction_id: 0HN18NIB8K5RV:00000001
                    description: Could not find the location.
      security:
      - BearerAuth: []
    post:
      tags:
      - Location Profile
      summary: Set location profile type
      description: 'Before setting the location profile type, ensure the client location profile configuration is set.

        - Business configuration is required to set business location types.

        - Residential configuration is required to set residential location types.


        Note: Locations that previously used the Home profile feature are automatically assigned the Residential profile type.

        You do not need to set the profile type for those locations. Only newly created locations that did not use the Home profile feature require a profile type to be set.'
      operationId: post-v3-location-profile-type
      parameters:
      - name: locationId
        in: path
        description: Location id
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        description: Profile type
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/LocationProfileType_2'
            examples:
              Residential type:
                value:
                  type: residential
              Business type:
                value:
                  type: business
          application/json:
            schema:
              $ref: '#/components/schemas/LocationProfileType_2'
            examples:
              Residential type:
                value:
                  type: residential
              Business type:
                value:
                  type: business
          text/json:
            schema:
              $ref: '#/components/schemas/LocationProfileType_2'
            examples:
              Residential type:
                value:
                  type: residential
              Business type:
                value:
                  type: business
          application/*+json:
            schema:
              $ref: '#/components/schemas/LocationProfileType_2'
            examples:
              Residential type:
                value:
                  type: residential
              Business type:
                value:
                  type: business
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationProfileType_2'
              examples:
                Residential type:
                  value:
                    type: residential
                Business type:
                  value:
                    type: business
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Change not allowed:
                  value:
                    code: EXISTING_PROFILE_VALUES_FOUND
                    transaction_id: 0HN18NIB8K5RV:00000001
                    description: Can not change profile type for a configured profile with existing values
                Profile settings not configured:
                  value:
                    code: PROFILE_CONFIGURATION_NOT_FOUND
                    transaction_id: 0HN18NIB8K5RV:00000001
