                    code: LOCATION_ID_MISSING
                    description: Parameter 'locationId' must not be null or empty
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Property key missing:
                  value:
                    code: PROPERTY_KEY_MISSING
                    description: Property key missing
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Property value missing:
                  value:
                    code: PROPERTY_VALUE_MISSING
                    description: Property value missing
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
