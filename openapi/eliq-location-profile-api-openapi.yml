openapi: 3.2.0
info:
  title: Eliq Location profile API
  version: '1.0'
  description: 'Operations tagged Location profile across 2 of this provider''s published API definitions: eliq-data-management-api-openapi.json, eliq-insights-api-openapi.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://localhost:3000
tags:
- name: Location Profile
paths:
  /locations/{locationId}/profile/type:
    post:
      tags:
      - Location Profile
      summary: Set location profile type
      operationId: set-locations-locationId-profile-type
      parameters:
      - name: locationId
        in: path
        description: Unique identifier of location
        required: true
        schema:
          type: string
      requestBody:
        description: Location profile type object to set
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/LocationProfileType'
            examples:
              Location profile:
                value:
                  type: residential
          application/json:
            schema:
              $ref: '#/components/schemas/LocationProfileType'
            examples:
              Location profile:
                value:
                  type: residential
          text/json:
            schema:
              $ref: '#/components/schemas/LocationProfileType'
            examples:
              Location profile:
                value:
                  type: residential
          application/*+json:
            schema:
              $ref: '#/components/schemas/LocationProfileType'
            examples:
              Location profile:
                value:
                  type: residential
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationProfileType'
              examples:
                Location profile:
                  value:
                    type: residential
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
              examples:
                Parameter 'locationId' must not be null or empty:
                  value:
                    code: LOCATION_ID_MISSING
                    description: Parameter 'locationId' must not be null or empty
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
              examples:
                Missing value:
                  value:
                    code: LOCATION_NOT_FOUND
                    description: Location with given id could not be found
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Missing profile value with given id:
                  value:
                    code: PROFILE_VALUE_NOT_FOUND
                    description: Location profile value not found for given id
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                User with given id could not be found:
                  value:
                    code: USER_NOT_FOUND
                    description: User with given id could not be found
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
              examples:
                Internal server error. If problem remains, please contact support:
                  value:
                    code: INTERNAL_ERROR
                    description: Internal server error. If problem remains, please contact support
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
    get:
      tags:
      - Location Profile
      summary: Get location profile type
      operationId: get-locations-locationId-profile-type
      parameters:
      - name: locationId
        in: path
        description: Unique identifier of location
        required: true
