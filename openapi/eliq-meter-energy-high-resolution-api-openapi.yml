        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
              examples:
                Request input is missing. This may be caused by incorrect format of input.:
                  value:
                    code: INPUT_MISSING
                    description: Request input is missing. This may be caused by incorrect format of input.
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Parameter 'id' must not be null or empty:
                  value:
                    code: METER_ID_MISSING
                    description: Parameter 'id' must not be null or empty
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Resolution must not be null or empty:
                  value:
                    code: RESOLUTION_MISSING
                    description: Resolution must not be null or empty
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                'Invalid resolution. Must be one of: [hour, 30min, 15min, 10min, 6min]':
                  value:
                    code: RESOLUTION_INVALID
                    description: 'Invalid resolution. Must be one of: [hour, 30min, 15min, 10min, 6min]'
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Maximum limit of element per request exceeded. Please refer to documentation for more information:
                  value:
                    code: ENERGY_SEQUENCE_LENGTH_LIMIT_EXCEEDED
                    description: Maximum limit of element per request exceeded. Please refer to documentation for more information
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Energy elements in sequence must be unique:
                  value:
                    code: ENERGY_SEQUENCE_CONTAINS_DUPLICATE_ELEMENTS
                    description: Energy elements in sequence must be unique
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Parameter 'energy_wh' must not be negative:
                  value:
                    code: ENERGY_ELEMENT_ENERGY_WH_INVALID
                    description: Parameter 'energy_wh' must not be negative
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Element in sequence must have either parameter 'energy_wh' or 'energy_m3':
                  value:
                    code: ENERGY_ELEMENT_ENERGY_WH_AND_ENERGY_M3_MISSING
                    description: Element in sequence must have either parameter 'energy_wh' or 'energy_m3'
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Element in sequence must have either parameter 'energy_wh' or 'energy_m3' but not both:
                  value:
                    code: ENERGY_ELEMENT_BOTH_ENERGY_WH_AND_ENERGY_M3_SET
                    description: Element in sequence must have either parameter 'energy_wh' or 'energy_m3' but not both
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Element in sequence has 'energy_m3' but the meter's fuel does not support it. 'energy_wh' is supported:
                  value:
                    code: ENERGY_ELEMENT_ENERGY_M3_ON_UNSUPPORTED_FUEL_METER
                    description: Element in sequence has 'energy_m3' but the meter's fuel does not support it. 'energy_wh' is supported
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                ? Parameter 'interval_start' must not be null. This may be caused by incorrect datetime format, please refer to documentation
                : value:
                    code: ENERGY_ELEMENT_INTERVAL_START_MISSING
                    description: Parameter 'interval_start' must not be null. This may be caused by incorrect datetime format, please refer to documentation
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                ? Parameter 'interval_start' must align with given resolution (eg. 'xx:00:00' for hourly, 'xx:00:00' and 'xx:30:00' for 30min). Please refer to documentation for more information
                : value:
                    code: ENERGY_ELEMENT_INTERVAL_START_DATE_INVALID_FOR_RESOLUTION
                    description: Parameter 'interval_start' must align with given resolution (eg. 'xx:00:00' for hourly, 'xx:00:00' and 'xx:30:00' for 30min). Please refer to documentation for more information
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Gap not matching resolution size between 'interval_start' dates have been found.:
                  value:
                    code: GAP_IN_ENERGY_DATE_INTERVAL
                    description: Gap not matching resolution size between 'interval_start' dates have been found.
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
                Parameter 'interval_start' must be between meter SupplyStartDate and SupplyEndDate dates.:
                  value:
                    code: ENERGY_INTERVAL_START_DATE_IS_OUTSIDE_METER_SUPPLY_DATE_RANGE
                    description: Parameter 'interval_start' must be between meter SupplyStartDate and SupplyEndDate dates.
                    request_id: 65e2ea86-470f-4363-9295-35d6b473981a
