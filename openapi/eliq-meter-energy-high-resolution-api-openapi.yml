openapi: 3.2.0
info:
  title: Eliq Data Management Meter Energy High Resolution API
  description: '# API Reference


    The Eliq data management API is organized around REST.'
  contact:
    name: Support
    email: support_b2b@eliq.com
  version: 1.5.2
tags:
- name: Meter Energy High Resolution
paths:
  /meters/{id}/energy/highres/{resolution}:
    post:
      tags:
      - Meter Energy High Resolution
      summary: Creates or updates high resolution (hourly or higher) energy data for a meter
      operationId: post-high-resolution-energy-meterid
      parameters:
      - name: id
        in: path
        description: Meter external reference
        required: true
        schema:
          type: string
      - name: resolution
        in: path
        description: Resolution of the data provided
        required: true
        schema:
          type: string
      requestBody:
        description: High resolution energy object to create or update
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/EnergyHighResolutionData'
            examples:
              Energy high resolution data:
                value:
                - interval_start: '2024-01-01T00:00:00Z'
                  energy_wh: 1000.0
                  is_estimated: false
                - interval_start: '2024-01-01T01:00:00Z'
                  energy_wh: 1000.0
                  is_estimated: false
                - interval_start: '2024-01-01T02:00:00Z'
