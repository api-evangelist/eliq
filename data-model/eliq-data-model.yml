core_model:
  description: 'Eliq''s published domain model: a User owns one or more Locations; a Location carries a Location
    Profile and a Home Profile and holds one or more Meters; a Meter carries Energy data (daily, period, high-resolution
    reads) and Price Formulas that convert kWh to currency. Insights are computed on top of that graph.'
  docs: https://developer.eliq.com/doc/eliqs-view-of-the-world
  entities:
  - User
  - Location
  - LocationProfile
  - HomeProfile
  - Meter
  - EnergyData
  - PriceFormula
identifiers:
