conformance:
- id: oauth2
  conforms: true
  evidence: https://developer.eliq.com/doc/authentication
  note: OAuth 2.0 client credentials grant, plus refresh_token grant. Token endpoint POST https://auth-api.eliq.com/oauth/token,
    accepting both application/json and application/x-www-form-urlencoded.
- id: oauth2-client-credentials
  conforms: true
  evidence: https://developer.eliq.com/doc/authentication
- id: jwt
  conforms: true
  evidence: https://auth-api.eliq.com/.well-known/jwks.json
  note: RS256-signed JWTs with a published asymmetric key set. Standard claims iss/aud/sub plus vendor claims org,
    org_type, sub_type, access_type.
- id: oidc
  conforms: false
  evidence: https://auth-api.eliq.com/.well-known/openid-configuration
  note: PARTIAL, recorded as false. A discovery document is served at the OIDC well-known path and returns 200,
    but carries only issuer and jwks_uri — no authorization_endpoint, token_endpoint, scopes_supported, response_types_supported
    or grant_types_supported. It supports signature verification, not OpenID Connect. Calling this OIDC-conformant
    would credit Eliq with a surface it does not run.
- id: rfc7517-jwks
  conforms: true
  evidence: https://auth-api.eliq.com/.well-known/jwks.json
- id: rfc9457
  conforms: false
  evidence: errors/eliq-problem-types.yml
  note: Errors are application/json with a first-party {code, description, request_id} envelope, not application/problem+json.
- id: json:api
  conforms: false
  evidence: openapi/
- id: odata
  conforms: false
  evidence: openapi/
- id: scim
