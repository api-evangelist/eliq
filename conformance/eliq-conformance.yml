- id: pagination
  conforms: true
  evidence: conventions/eliq-conventions.yml
  note: Keyset pagination — limit + after_id / after_user_id / created_after cursors.
- id: rfc8594-sunset
  conforms: false
  evidence: https://developer.eliq.com/doc/eliq-api-guidelines
  note: A 180-day deprecation window is published in prose, but no Deprecation or Sunset response header is emitted.
- id: iso8601
  conforms: true
  evidence: https://developer.eliq.com/doc/date-and-time
  note: ISO 8601 throughout; Insights in location local time, Data Management in UTC for high-resolution data and
    local time for daily data.
- id: ndjson
  conforms: true
  evidence: https://developer.eliq.com/doc/jobs
  note: application/x-ndjson is the async bulk format; declared on 9 job operations in the Data Management contract.
- id: hmac-sha256-webhook-signing
  conforms: true
  evidence: https://developer.eliq.com/doc/webhooks
  note: 'X-Eliq-Signature: t=<unix>,sha256=<hex> over "{timestamp}.{json_payload}", Stripe-shaped. Consumers must
    dedupe on event id; Eliq retries for up to 24 hours.'
- id: openapi-3
  conforms: true
  evidence: openapi/
  note: 'Four published documents: OpenAPI 3.1.0 (Auth, Insights) and 3.0.1 (Data Management, Intelligence). 148
    operations, 138 with unique operationIds, 134 carrying in-spec examples.'
- id: gdpr
  conforms: true
  evidence: https://www.eliq.com/privacy-api/
  note: Eliq AB is a Swedish controller/processor and states it is subject to Swedish data protection legislation
    including GDPR. The Insights API carries an explicit user-consent surface (PUT /v3/users/{userId}/consents),
    and the guidelines require that consents are only updated following an explicit user action.
