- aid: eliq:insights
  name: Eliq Insights API
  description: The Eliq Insights API delivers analytics and presentation-ready data for end-user energy
    applications. It exposes consumption aggregates by day, week, month, and year, trends, cost, CO2 footprint,
    day-ahead pricing, weather, peak power, tariff comparisons, PV disaggregation, forecasting, anomalies,
    and budget or goal tracking. Device-specific energy insights use NILM disaggregation to attribute
    consumption to appliances.
  humanURL: https://developer.eliq.com/api-reference/insights-api
