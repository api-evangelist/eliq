- aid: eliq:data-management
  name: Eliq Data Management API
  description: The Eliq Data Management API ingests and manages customer, location, and meter data inside
    the Eliq system. Clients use it to provision users and locations, post energy consumption readings,
    attach metadata such as tariffs and dwelling information, and keep the dataset that powers the Insights
    API up to date.
