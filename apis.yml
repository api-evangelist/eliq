- aid: eliq:intelligence
  name: Eliq Intelligence API
  description: The Eliq Intelligence API provides customer-level analytics designed for utility service,
    operations, and growth teams. It supports customer segmentation, behavioral classification, and personalized
    recommendations derived from consumption history, weather, tariffs, and disaggregation models. Access
    to the Intelligence API is granted on request.
